<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6f44"/>
      <stop offset="100%" stop-color="#2c5234"/>
    </linearGradient>
  </defs>
  <!-- Hintergrund mit Rundung -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Holzrahmen -->
  <rect x="64" y="120" width="384" height="276" rx="22" fill="#a8763d"/>
  <rect x="80" y="136" width="352" height="244" rx="14" fill="#8a5a26"/>
  <!-- Tafel -->
  <rect x="92" y="148" width="328" height="220" rx="8" fill="url(#boardGrad)"/>
  <!-- Buchstaben-Reihe (bunte Kreidefarben) -->
  <text x="256" y="232" font-family="Verdana, sans-serif" font-size="92" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="6">
    <tspan fill="#ff8a65">A</tspan><tspan fill="#fff176">B</tspan><tspan fill="#81d4fa">C</tspan>
  </text>
  <!-- Zahlen-Reihe -->
  <text x="256" y="320" font-family="Verdana, sans-serif" font-size="80" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="14">
    <tspan fill="#a5d6a7">1</tspan><tspan fill="#f48fb1">2</tspan><tspan fill="#ffd54f">3</tspan>
  </text>
  <!-- Kreidestücke unterhalb -->
  <rect x="180" y="412" width="50" height="14" rx="3" fill="#fff176" transform="rotate(-6 205 419)"/>
  <rect x="240" y="416" width="44" height="13" rx="3" fill="#ff8a65" transform="rotate(4 262 422)"/>
  <rect x="300" y="412" width="48" height="14" rx="3" fill="#81d4fa" transform="rotate(-2 324 419)"/>
</svg>
