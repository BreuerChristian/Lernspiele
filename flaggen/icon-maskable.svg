    <rect width="260" height="200" rx="22" fill="#1a1a1a"/>
    <rect y="67" width="260" height="66" fill="#d62828"/>
    <rect y="133" width="260" height="67" fill="#f7c948"/>
    <rect width="260" height="200" rx="22" fill="none" stroke="white" stroke-width="8"/>
  </g>
</svg>
