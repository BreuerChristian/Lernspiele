<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Quelle: flaggen (eigene Vektor-Definition aus dem Spiel) -->
                <rect width="300" height="200" fill="#012169"/>
                <!-- Diagonalen weiss -->
                <path d="M0,0 L300,200 M300,0 L0,200" stroke="white" stroke-width="40"/>
                <!-- Diagonalen rot duenner -->
                <path d="M0,0 L300,200 M300,0 L0,200" stroke="#c8102e" stroke-width="14"/>
                <!-- Mittelkreuz weiss -->
                <rect x="125" width="50" height="200" fill="white"/>
                <rect y="75" width="300" height="50" fill="white"/>
                <!-- Mittelkreuz rot -->
                <rect x="135" width="30" height="200" fill="#c8102e"/>
                <rect y="85" width="300" height="30" fill="#c8102e"/>
            </svg>
