<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Buchstaben-Spiel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#764ba2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Buchstaben">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --color-primary: #764ba2;
      --color-light:   #e0d0ed;
      --color-dark:    #4a2a6a;
      --color-bg:      #f7f3fa;
      --radius-card:   28px;
      --radius-btn:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Verdana', 'Tahoma', sans-serif;
      background: var(--color-bg);
      color: #2a2a2a;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .screen.hidden { display: none; }

    /* ---------- Start-Screen ---------- */
    #screen-start {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center; align-items: center;
      padding-top: 20px; overflow-y: auto;
    }
    #screen-start .card {
      background: white; border-radius: var(--radius-card);
      padding: 32px 28px; max-width: 540px; width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      text-align: center;
    }
    #screen-start h1 { color: var(--color-primary); font-size: 2.2rem; margin-bottom: 6px; }
    #screen-start .sub { color: var(--color-dark); margin-bottom: 22px; font-size: 1rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--color-primary); text-decoration: none;
      font-size: 0.95rem; font-weight: bold;
      margin-bottom: 14px; padding: 8px 14px;
      border-radius: 12px; background: var(--color-light);
      transition: background 0.15s;
    }
    .back-link:hover, .back-link:focus { background: var(--color-bg); }

    .group { margin-bottom: 22px; text-align: left; }
    .group h2 {
      color: var(--color-primary);
      font-size: 1.05rem; margin-bottom: 10px;
      font-weight: bold; text-align: center;
    }
    .group-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .group-btn {
      border: none; border-radius: 18px;
      padding: 18px 8px;
      font-family: inherit; font-size: 1rem; font-weight: bold;
      color: white; cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.18);
      transition: transform 0.15s;
    }
    .group-btn:active { transform: scale(0.96); }
    .group-btn:nth-child(1)  { background: linear-gradient(145deg, #ff6b6b, #ee5a5a); }
    .group-btn:nth-child(2)  { background: linear-gradient(145deg, #feca57, #ff9f43); }
    .group-btn:nth-child(3)  { background: linear-gradient(145deg, #48dbfb, #0abde3); }
    .group-btn:nth-child(4)  { background: linear-gradient(145deg, #1dd1a1, #10ac84); }
    .group-btn:nth-child(5)  { background: linear-gradient(145deg, #5f27cd, #341f97); }
    .group-btn:nth-child(6)  { background: linear-gradient(145deg, #ff9ff3, #f368e0); }
    .group-btn:nth-child(7)  { background: linear-gradient(145deg, #54a0ff, #2e86de); }
    .group-btn:nth-child(8)  { background: linear-gradient(145deg, #ff6b6b, #c0392b); }
    .group-btn:nth-child(9)  { background: linear-gradient(145deg, #26de81, #20bf6b); }
    .group-btn:nth-child(10) { background: linear-gradient(145deg, #a55eea, #8854d0); }

    /* ---------- Game-Screen ---------- */
    #screen-game {
      background: var(--color-bg);
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
      padding: 6px 4px 14px;
    }
    .hud .stage {
      color: var(--color-dark); font-size: 0.9rem; font-weight: bold;
      justify-self: start;
    }
    .hud .progress {
      color: var(--color-primary); font-size: 1rem; font-weight: bold;
      padding: 6px 14px; background: white; border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .hud .hud-btn {
      width: 44px; height: 44px; border: none;
      background: white; border-radius: 50%;
      font-size: 1.4rem; font-weight: bold; color: var(--color-primary);
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.10);
      justify-self: end;
      display: flex; align-items: center; justify-content: center;
    }

    .play-area {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
    }
    .image-display {
      font-size: 120px; line-height: 1;
    }
    .word-display {
      display: flex; justify-content: center;
      gap: 8px; flex-wrap: wrap;
      min-height: 70px;
    }
    .letter-slot {
      width: 50px; height: 60px;
      background: white; border: 3px dashed var(--color-light);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold;
      color: var(--color-primary);
      transition: all 0.2s ease;
    }
    .letter-slot.filled {
      background: linear-gradient(145deg, #1dd1a1, #10ac84);
      border: 3px solid #10ac84;
      color: white;
    }

    .letter-buttons {
      display: flex; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      max-width: 520px;
    }
    .letter-btn {
      width: 60px; height: 60px;
      background: linear-gradient(145deg, #667eea, var(--color-primary));
      border: none; border-radius: 14px;
      font-size: 1.7rem; font-weight: bold; color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
      transition: transform 0.1s;
    }
    .letter-btn:active { transform: scale(0.94); }
    .letter-btn.used {
      background: #ccc; cursor: not-allowed;
      box-shadow: none; opacity: 0.5;
    }
    .letter-btn.wrong { animation: wrong-wiggle 0.45s ease; background: linear-gradient(145deg, #ff6b6b, #ee5a5a); }

    /* Success-Overlay nach komplettem Wort */
    .success-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center; align-items: center;
      z-index: 1000;
    }
    .success-overlay.show { display: flex; }
    .success-card {
      background: white; border-radius: var(--radius-card);
      padding: 40px 50px; text-align: center;
      animation: pop-in 0.45s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .success-emoji { font-size: 80px; line-height: 1; margin-bottom: 12px; }
    .success-word {
      color: var(--color-dark); font-size: 1.6rem; font-weight: bold;
      letter-spacing: 3px;
    }

    /* ---------- End-Screen ---------- */
    #screen-end {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center; align-items: center;
    }
    #screen-end .card {
      background: white; border-radius: var(--radius-card);
      padding: 32px 28px; max-width: 480px; width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18); text-align: center;
    }
    #screen-end h2 { color: var(--color-primary); font-size: 1.8rem; margin-bottom: 10px; }
    #screen-end p  { color: var(--color-dark); margin-bottom: 22px; }
    #screen-end .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-primary {
      width: 100%; padding: 16px;
      background: var(--color-primary); color: white;
      border: none; border-radius: var(--radius-btn);
      font-family: inherit; font-size: 1.1rem; font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      padding: 14px; background: white; color: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-btn);
      font-family: inherit; font-size: 1rem; font-weight: bold;
      cursor: pointer; text-decoration: none; display: block;
      text-align: center;
    }

    /* ---------- Standard-Animationen ---------- */
    @keyframes correct-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    @keyframes wrong-wiggle {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    .fade-in { animation: fade-in 0.25s ease; }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    @media (max-width: 420px) {
      #screen-start h1 { font-size: 1.7rem; }
      .group-grid { grid-template-columns: repeat(2, 1fr); }
      .image-display { font-size: 90px; }
      .letter-slot { width: 42px; height: 52px; font-size: 1.6rem; }
      .letter-btn { width: 50px; height: 50px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- ====================== START-SCREEN ====================== -->
  <div id="screen-start" class="screen">
    <div class="card">
      <a href="../" class="back-link" aria-label="Zurueck zur Spiele-Uebersicht">&larr; Übersicht</a>
      <h1>Buchstaben-Spiel</h1>
      <p class="sub">Tippe die Buchstaben in der richtigen Reihenfolge.</p>

      <div class="group">
        <h2>Gruppe waehlen</h2>
        <div class="group-grid" id="group-buttons">
          <!-- via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ====================== GAME-SCREEN ====================== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="stage" id="hud-stage">Gruppe 1</span>
      <span class="progress" id="hud-progress">Aufgabe 1/10</span>
      <button class="hud-btn" id="hud-close" aria-label="Spiel beenden, zurueck zum Start">×</button>
    </div>

    <div class="play-area">
      <div class="image-display" id="image-display"></div>
      <div class="word-display" id="word-display"></div>
      <div class="letter-buttons" id="letter-buttons"></div>
    </div>
  </div>

  <!-- ====================== END-SCREEN ====================== -->
  <div id="screen-end" class="screen hidden">
    <div class="card">
      <h2>Schoene Runde!</h2>
      <p id="end-message">Alle Woerter dieser Gruppe sind durch.</p>
      <div class="actions">
        <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
        <button class="btn-secondary" id="btn-restage">Andere Gruppe</button>
        <a class="btn-secondary" href="../">Zur Uebersicht</a>
      </div>
    </div>
  </div>

  <!-- Erfolgs-Overlay nach komplettem Wort -->
  <div class="success-overlay" id="success-overlay" aria-hidden="true">
    <div class="success-card">
      <div class="success-emoji" id="success-emoji">📖</div>
      <div class="success-word" id="success-word"></div>
    </div>
  </div>

  <!-- ====================== AUDIO-LIB ====================== -->
  <script src="../_lib/audio.js"></script>

  <!-- ====================== SPIEL-LOGIK ====================== -->
  <script>
    'use strict';

    const GAME_ID = 'buchstaben';
    const PREFS_KEY = GAME_ID + '-prefs';

    // 100 Wörter in 10 Gruppen, je 10
    const allWords = [
      // Gruppe 1 (3-4 Buchstaben, sehr einfach)
      { word: "EIS", emoji: "🍦" }, { word: "HUT", emoji: "🎩" }, { word: "BUS", emoji: "🚌" },
      { word: "UHR", emoji: "🕐" }, { word: "OHR", emoji: "👂" }, { word: "EI", emoji: "🥚" },
      { word: "ZUG", emoji: "🚂" }, { word: "KUH", emoji: "🐄" }, { word: "NUSS", emoji: "🥜" },
      { word: "BAD", emoji: "🛁" },
      // Gruppe 2
      { word: "AUTO", emoji: "🚗" }, { word: "BALL", emoji: "⚽" }, { word: "BAUM", emoji: "🌳" },
      { word: "HUND", emoji: "🐕" }, { word: "HAUS", emoji: "🏠" }, { word: "MOND", emoji: "🌙" },
      { word: "BOOT", emoji: "⛵" }, { word: "FUSS", emoji: "🦶" }, { word: "BROT", emoji: "🍞" },
      { word: "NEST", emoji: "🪺" },
      // Gruppe 3
      { word: "BETT", emoji: "🛏️" }, { word: "BUCH", emoji: "📖" }, { word: "BERG", emoji: "⛰️" },
      { word: "HAND", emoji: "✋" }, { word: "KOPF", emoji: "👤" }, { word: "MUND", emoji: "👄" },
      { word: "TOPF", emoji: "🍲" }, { word: "FISCH", emoji: "🐟" }, { word: "OBST", emoji: "🍎" },
      { word: "WOLF", emoji: "🐺" },
      // Gruppe 4
      { word: "APFEL", emoji: "🍎" }, { word: "VOGEL", emoji: "🐦" }, { word: "STERN", emoji: "⭐" },
      { word: "HERZ", emoji: "❤️" }, { word: "BLUME", emoji: "🌸" }, { word: "WOLKE", emoji: "☁️" },
      { word: "PIZZA", emoji: "🍕" }, { word: "TIGER", emoji: "🐯" }, { word: "MAUS", emoji: "🐭" },
      { word: "KATZE", emoji: "🐱" },
      // Gruppe 5
      { word: "KERZE", emoji: "🕯️" }, { word: "KLEID", emoji: "👗" }, { word: "KOFFER", emoji: "🧳" },
      { word: "LAMPE", emoji: "💡" }, { word: "NACHT", emoji: "🌃" }, { word: "PFERD", emoji: "🐴" },
      { word: "SONNE", emoji: "☀️" }, { word: "TASSE", emoji: "☕" }, { word: "SCHUH", emoji: "👟" },
      { word: "STUHL", emoji: "🪑" },
      // Gruppe 6
      { word: "BANANE", emoji: "🍌" }, { word: "BRILLE", emoji: "👓" }, { word: "ORANGE", emoji: "🍊" },
      { word: "REGEN", emoji: "🌧️" }, { word: "MILCH", emoji: "🥛" }, { word: "HASE", emoji: "🐰" },
      { word: "JACKE", emoji: "🧥" }, { word: "KUCHEN", emoji: "🍰" }, { word: "BRIEF", emoji: "✉️" },
      { word: "RADIO", emoji: "📻" },
      // Gruppe 7
      { word: "SCHAF", emoji: "🐑" }, { word: "SPINNE", emoji: "🕷️" }, { word: "DRACHE", emoji: "🐉" },
      { word: "FROSCH", emoji: "🐸" }, { word: "KIRSCHE", emoji: "🍒" }, { word: "RAKETE", emoji: "🚀" },
      { word: "SCHIFF", emoji: "🚢" }, { word: "TELEFON", emoji: "📞" }, { word: "WASSER", emoji: "💧" },
      { word: "ZEBRA", emoji: "🦓" },
      // Gruppe 8
      { word: "ANANAS", emoji: "🍍" }, { word: "FLASCHE", emoji: "🍼" }, { word: "KAMERA", emoji: "📷" },
      { word: "PINGUIN", emoji: "🐧" }, { word: "REGENBOGEN", emoji: "🌈" }, { word: "SCHLANGE", emoji: "🐍" },
      { word: "TRAKTOR", emoji: "🚜" }, { word: "WINTER", emoji: "❄️" }, { word: "ZITRONE", emoji: "🍋" },
      { word: "KROKODIL", emoji: "🐊" },
      // Gruppe 9
      { word: "DELFIN", emoji: "🐬" }, { word: "EINHORN", emoji: "🦄" }, { word: "GESCHENK", emoji: "🎁" },
      { word: "COMPUTER", emoji: "💻" }, { word: "HAMBURGER", emoji: "🍔" }, { word: "KARTOFFEL", emoji: "🥔" },
      { word: "LUFTBALLON", emoji: "🎈" }, { word: "ERDBEERE", emoji: "🍓" }, { word: "SCHMETTERLING", emoji: "🦋" },
      { word: "SCHOKOLADE", emoji: "🍫" },
      // Gruppe 10
      { word: "ELEFANT", emoji: "🐘" }, { word: "KAMEL", emoji: "🐫" }, { word: "WASSERMELONE", emoji: "🍉" },
      { word: "DINOSAURIER", emoji: "🦕" }, { word: "FLUGZEUG", emoji: "✈️" }, { word: "HUBSCHRAUBER", emoji: "🚁" },
      { word: "SONNENBLUME", emoji: "🌻" }, { word: "WEIHNACHTSMANN", emoji: "🎅" }, { word: "GEBURTSTAG", emoji: "🎂" },
      { word: "REGENSCHIRM", emoji: "☔" }
    ];

    const state = {
      group: 0,
      taskIdx: 0,
      currentWord: '',
      currentEmoji: '',
      entered: [],
      shuffled: [],
      locked: false
    };

    function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } }
    function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) {} }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('fade-in');
      setTimeout(() => el.classList.remove('fade-in'), 300);
    }

    function initStartScreen() {
      const container = document.getElementById('group-buttons');
      container.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'group-btn';
        btn.textContent = 'Gruppe ' + i;
        btn.setAttribute('aria-label', 'Gruppe ' + i + ' starten');
        btn.addEventListener('click', () => startGroup(i - 1));
        container.appendChild(btn);
      }
    }

    function startGroup(idx) {
      state.group = idx;
      state.taskIdx = 0;
      savePrefs({ lastGroup: idx });
      showScreen('screen-game');
      document.getElementById('hud-stage').textContent = 'Gruppe ' + (idx + 1);
      loadWord();
    }

    function loadWord() {
      const wordData = allWords[state.group * 10 + state.taskIdx];
      state.currentWord = wordData.word;
      state.currentEmoji = wordData.emoji;
      state.entered = [];
      state.shuffled = state.currentWord.split('').sort(() => Math.random() - 0.5);
      state.locked = false;

      document.getElementById('hud-progress').textContent =
        'Aufgabe ' + (state.taskIdx + 1) + '/10';
      document.getElementById('image-display').textContent = state.currentEmoji;

      renderWordSlots();
      renderLetterButtons();
    }

    function renderWordSlots() {
      const container = document.getElementById('word-display');
      container.innerHTML = '';
      for (let i = 0; i < state.currentWord.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'letter-slot' + (state.entered[i] ? ' filled' : '');
        slot.textContent = state.entered[i] || '';
        container.appendChild(slot);
      }
    }

    function renderLetterButtons() {
      const container = document.getElementById('letter-buttons');
      container.innerHTML = '';
      state.shuffled.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.setAttribute('aria-label', 'Buchstabe ' + letter);
        btn.addEventListener('click', () => handleLetterClick(letter, btn));
        container.appendChild(btn);
      });
      updateUsedButtons();
    }

    function updateUsedButtons() {
      const buttons = document.querySelectorAll('.letter-btn');
      const usedCounts = {};
      state.entered.forEach(l => { usedCounts[l] = (usedCounts[l] || 0) + 1; });
      const seen = {};
      buttons.forEach(btn => {
        const l = btn.textContent;
        seen[l] = (seen[l] || 0) + 1;
        const used = usedCounts[l] || 0;
        if (seen[l] <= used) btn.classList.add('used');
        else                 btn.classList.remove('used');
      });
    }

    function handleLetterClick(letter, btn) {
      if (state.locked) return;
      if (btn.classList.contains('used')) return;
      const expected = state.currentWord[state.entered.length];
      if (letter === expected) {
        state.entered.push(letter);
        btn.classList.add('used');
        renderWordSlots();
        updateUsedButtons();
        if (state.entered.length === state.currentWord.length) {
          state.locked = true;
          Lernspiele.Audio.correct();
          setTimeout(showSuccess, 250);
        } else {
          Lernspiele.Audio.tap();
        }
      } else {
        btn.classList.add('wrong');
        Lernspiele.Audio.wrong();
        setTimeout(() => btn.classList.remove('wrong'), 500);
      }
    }

    function showSuccess() {
      document.getElementById('success-emoji').textContent = state.currentEmoji;
      document.getElementById('success-word').textContent = state.currentWord;
      const overlay = document.getElementById('success-overlay');
      overlay.classList.add('show');
      setTimeout(() => {
        overlay.classList.remove('show');
        nextWord();
      }, 1200);
    }

    function nextWord() {
      state.taskIdx++;
      if (state.taskIdx >= 10) endGroup();
      else loadWord();
    }

    function endGroup() {
      showScreen('screen-end');
      const next = state.group < 9 ? 'Nächste Gruppe: ' + (state.group + 2) : 'Du hast alle 10 Gruppen geschafft!';
      document.getElementById('end-message').textContent =
        'Alle 10 Woerter dieser Gruppe sind durch.';
    }

    document.getElementById('btn-replay').onclick = () => startGroup(state.group);
    document.getElementById('btn-restage').onclick = () => showScreen('screen-start');
    document.getElementById('hud-close').addEventListener('click', () => showScreen('screen-start'));

    document.addEventListener('pointerdown', () => {
      if (window.Lernspiele && Lernspiele.Audio) Lernspiele.Audio.ensure();
    }, { once: true });

    initStartScreen();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
