<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buchstaben-Spiel</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#764ba2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Buchstaben">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #764ba2;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Startseite */
        #start-screen h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .group-btn {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            border: none;
            border-radius: 20px;
            padding: 25px 15px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(238, 90, 90, 0.4);
        }

        .group-btn:nth-child(2) { background: linear-gradient(145deg, #feca57, #ff9f43); box-shadow: 0 8px 15px rgba(254, 202, 87, 0.4); }
        .group-btn:nth-child(3) { background: linear-gradient(145deg, #48dbfb, #0abde3); box-shadow: 0 8px 15px rgba(72, 219, 251, 0.4); }
        .group-btn:nth-child(4) { background: linear-gradient(145deg, #1dd1a1, #10ac84); box-shadow: 0 8px 15px rgba(29, 209, 161, 0.4); }
        .group-btn:nth-child(5) { background: linear-gradient(145deg, #5f27cd, #341f97); box-shadow: 0 8px 15px rgba(95, 39, 205, 0.4); }
        .group-btn:nth-child(6) { background: linear-gradient(145deg, #ff9ff3, #f368e0); box-shadow: 0 8px 15px rgba(255, 159, 243, 0.4); }
        .group-btn:nth-child(7) { background: linear-gradient(145deg, #54a0ff, #2e86de); box-shadow: 0 8px 15px rgba(84, 160, 255, 0.4); }
        .group-btn:nth-child(8) { background: linear-gradient(145deg, #ff6b6b, #c0392b); box-shadow: 0 8px 15px rgba(255, 107, 107, 0.4); }
        .group-btn:nth-child(9) { background: linear-gradient(145deg, #26de81, #20bf6b); box-shadow: 0 8px 15px rgba(38, 222, 129, 0.4); }
        .group-btn:nth-child(10) { background: linear-gradient(145deg, #a55eea, #8854d0); box-shadow: 0 8px 15px rgba(165, 94, 234, 0.4); }

        .group-btn:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .group-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Spielscreen */
        #game-screen {
            display: none;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 15px;
            height: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #1dd1a1, #10ac84);
            height: 100%;
            border-radius: 15px;
            transition: width 0.5s ease;
        }

        .progress-text {
            color: #666;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .image-container {
            font-size: 150px;
            margin: 30px 0;
            line-height: 1;
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            min-height: 80px;
        }

        .letter-slot {
            width: 60px;
            height: 70px;
            background: #f0f0f0;
            border: 4px dashed #ccc;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #764ba2;
            transition: all 0.3s ease;
        }

        .letter-slot.filled {
            background: linear-gradient(145deg, #1dd1a1, #10ac84);
            border: 4px solid #10ac84;
            color: white;
        }

        .letter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .letter-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .letter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.5);
        }

        .letter-btn:active {
            transform: translateY(0);
        }

        .letter-btn.used {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: scale(0.9);
            opacity: 0.5;
        }

        .letter-btn.wrong {
            animation: shake 0.5s ease;
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a) !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(-10px) rotate(-5deg); }
            80% { transform: translateX(10px) rotate(5deg); }
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            background: linear-gradient(145deg, #54a0ff, #2e86de);
            border: none;
            border-radius: 25px;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(84, 160, 255, 0.4);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
        }

        .nav-btn.home-btn {
            background: linear-gradient(145deg, #ff9ff3, #f368e0);
            box-shadow: 0 6px 15px rgba(255, 159, 243, 0.4);
        }

        .nav-btn.skip-btn {
            background: linear-gradient(145deg, #feca57, #ff9f43);
            box-shadow: 0 6px 15px rgba(254, 202, 87, 0.4);
        }

        /* Erfolgs-Animation */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-message {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-message h2 {
            color: #1dd1a1;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .success-emoji {
            font-size: 80px;
            margin: 20px 0;
        }

        .success-message button {
            background: linear-gradient(145deg, #1dd1a1, #10ac84);
            border: none;
            border-radius: 25px;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .success-message button:hover {
            transform: scale(1.05);
        }

        /* Gruppen-Abschluss */
        .group-complete {
            display: none;
        }

        .group-complete.show {
            display: block;
        }

        .group-complete h2 {
            color: #1dd1a1;
            font-size: 2rem;
        }

        .stars {
            font-size: 60px;
            margin: 20px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .group-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-container {
                font-size: 100px;
            }

            .letter-slot {
                width: 45px;
                height: 55px;
                font-size: 1.8rem;
            }

            .letter-btn {
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buchstaben-Spiel</h1>

        <!-- Startseite -->
        <div id="start-screen">
            <h2>Wähle eine Gruppe!</h2>
            <div class="group-grid" id="group-buttons">
                <!-- Wird durch JS generiert -->
            </div>
        </div>

        <!-- Spielscreen -->
        <div id="game-screen">
            <div class="progress-text">Aufgabe <span id="current-task">1</span> von 10</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="image-container" id="image-display"></div>

            <div class="word-display" id="word-display">
                <!-- Buchstaben-Slots -->
            </div>

            <div class="letter-buttons" id="letter-buttons">
                <!-- Buchstaben-Buttons -->
            </div>

            <div class="nav-buttons">
                <button class="nav-btn home-btn" onclick="goHome()">Zurück</button>
                <button class="nav-btn skip-btn" onclick="skipWord()">Überspringen</button>
            </div>
        </div>

        <!-- Gruppen-Abschluss -->
        <div id="group-complete" class="group-complete">
            <h2>Gruppe geschafft!</h2>
            <div class="stars">⭐⭐⭐</div>
            <p style="font-size: 1.3rem; color: #666; margin: 20px 0;">Du hast alle 10 Wörter richtig!</p>
            <div class="nav-buttons">
                <button class="nav-btn home-btn" onclick="goHome()">Zur Auswahl</button>
                <button class="nav-btn" onclick="nextGroup()">Nächste Gruppe</button>
            </div>
        </div>
    </div>

    <!-- Erfolgs-Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-message">
            <h2>Richtig!</h2>
            <div class="success-emoji">🎉</div>
        </div>
    </div>

    <script>
        // 100 Wörter mit Emojis, nach Schwierigkeit sortiert
        const allWords = [
            // Gruppe 1 (3-4 Buchstaben, sehr einfach)
            { word: "EIS", emoji: "🍦" },
            { word: "HUT", emoji: "🎩" },
            { word: "BUS", emoji: "🚌" },
            { word: "UHR", emoji: "🕐" },
            { word: "OHR", emoji: "👂" },
            { word: "EI", emoji: "🥚" },
            { word: "ZUG", emoji: "🚂" },
            { word: "KUH", emoji: "🐄" },
            { word: "NUS", emoji: "🥜" },
            { word: "BAD", emoji: "🛁" },

            // Gruppe 2 (3-4 Buchstaben)
            { word: "AUTO", emoji: "🚗" },
            { word: "BALL", emoji: "⚽" },
            { word: "BAUM", emoji: "🌳" },
            { word: "HUND", emoji: "🐕" },
            { word: "HAUS", emoji: "🏠" },
            { word: "MOND", emoji: "🌙" },
            { word: "BOOT", emoji: "⛵" },
            { word: "FUSS", emoji: "🦶" },
            { word: "BROT", emoji: "🍞" },
            { word: "NEST", emoji: "🪺" },

            // Gruppe 3 (3-4 Buchstaben)
            { word: "BETT", emoji: "🛏️" },
            { word: "BUCH", emoji: "📖" },
            { word: "BERG", emoji: "⛰️" },
            { word: "HAND", emoji: "✋" },
            { word: "KOPF", emoji: "🗣️" },
            { word: "TUER", emoji: "🚪" },
            { word: "TOPF", emoji: "🍲" },
            { word: "FISCH", emoji: "🐟" },
            { word: "OBST", emoji: "🍎" },
            { word: "WOLF", emoji: "🐺" },

            // Gruppe 4 (4-5 Buchstaben)
            { word: "APFEL", emoji: "🍎" },
            { word: "VOGEL", emoji: "🐦" },
            { word: "STERN", emoji: "⭐" },
            { word: "HERZ", emoji: "❤️" },
            { word: "BLUME", emoji: "🌸" },
            { word: "WOLKE", emoji: "☁️" },
            { word: "PIZZA", emoji: "🍕" },
            { word: "TIGER", emoji: "🐯" },
            { word: "MAUS", emoji: "🐭" },
            { word: "KATZE", emoji: "🐱" },

            // Gruppe 5 (4-5 Buchstaben)
            { word: "KERZE", emoji: "🕯️" },
            { word: "KLEID", emoji: "👗" },
            { word: "KOFFER", emoji: "🧳" },
            { word: "LAMPE", emoji: "💡" },
            { word: "NACHT", emoji: "🌙" },
            { word: "PFERD", emoji: "🐴" },
            { word: "SONNE", emoji: "☀️" },
            { word: "TASSE", emoji: "☕" },
            { word: "SCHUH", emoji: "👟" },
            { word: "STUHL", emoji: "🪑" },

            // Gruppe 6 (4-5 Buchstaben)
            { word: "BANANE", emoji: "🍌" },
            { word: "BRILLE", emoji: "👓" },
            { word: "ORANGE", emoji: "🍊" },
            { word: "REGEN", emoji: "🌧️" },
            { word: "MILCH", emoji: "🥛" },
            { word: "HASE", emoji: "🐰" },
            { word: "JACKE", emoji: "🧥" },
            { word: "KUCHEN", emoji: "🍰" },
            { word: "BRIEF", emoji: "✉️" },
            { word: "RADIO", emoji: "📻" },

            // Gruppe 7 (5-6 Buchstaben)
            { word: "SCHAF", emoji: "🐑" },
            { word: "SPINNE", emoji: "🕷️" },
            { word: "DRACHE", emoji: "🐉" },
            { word: "FROSCH", emoji: "🐸" },
            { word: "KIRSCHE", emoji: "🍒" },
            { word: "RAKETE", emoji: "🚀" },
            { word: "SCHIFF", emoji: "🚢" },
            { word: "TELEFON", emoji: "📞" },
            { word: "WASSER", emoji: "💧" },
            { word: "ZEBRA", emoji: "🦓" },

            // Gruppe 8 (5-6 Buchstaben)
            { word: "ANANAS", emoji: "🍍" },
            { word: "FLASCHE", emoji: "🍼" },
            { word: "KAMERA", emoji: "📷" },
            { word: "PINGUIN", emoji: "🐧" },
            { word: "REGENBOGEN", emoji: "🌈" },
            { word: "SCHLANGE", emoji: "🐍" },
            { word: "TRAKTOR", emoji: "🚜" },
            { word: "WEIHNACHT", emoji: "🎄" },
            { word: "ZITRONE", emoji: "🍋" },
            { word: "KROKODIL", emoji: "🐊" },

            // Gruppe 9 (6-8 Buchstaben)
            { word: "DELFIN", emoji: "🐬" },
            { word: "EINHORN", emoji: "🦄" },
            { word: "GESCHENK", emoji: "🎁" },
            { word: "COMPUTER", emoji: "💻" },
            { word: "HAMBURGER", emoji: "🍔" },
            { word: "KARTOFFEL", emoji: "🥔" },
            { word: "LUFTBALLON", emoji: "🎈" },
            { word: "ERDBEERE", emoji: "🍓" },
            { word: "SCHMETTERLING", emoji: "🦋" },
            { word: "SCHOKOLADE", emoji: "🍫" },

            // Gruppe 10 (6-8 Buchstaben)
            { word: "ELEFANT", emoji: "🐘" },
            { word: "SCHILDKROETE", emoji: "🐢" },
            { word: "WASSERMELONE", emoji: "🍉" },
            { word: "DINOSAURIER", emoji: "🦕" },
            { word: "FLUGZEUG", emoji: "✈️" },
            { word: "HUBSCHRAUBER", emoji: "🚁" },
            { word: "SONNENBLUME", emoji: "🌻" },
            { word: "WEIHNACHTSMANN", emoji: "🎅" },
            { word: "GEBURTSTAG", emoji: "🎂" },
            { word: "REGENSCHIRM", emoji: "☔" }
        ];

        let currentGroup = 0;
        let currentWordIndex = 0;
        let currentWord = "";
        let currentEmoji = "";
        let enteredLetters = [];
        let shuffledLetters = [];

        // Gruppen-Buttons erstellen
        function initGroupButtons() {
            const container = document.getElementById('group-buttons');
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'group-btn';
                btn.textContent = `Gruppe ${i}`;
                btn.onclick = () => startGroup(i - 1);
                container.appendChild(btn);
            }
        }

        // Gruppe starten
        function startGroup(groupIndex) {
            currentGroup = groupIndex;
            currentWordIndex = 0;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('group-complete').classList.remove('show');
            loadWord();
        }

        // Wort laden
        function loadWord() {
            const wordData = allWords[currentGroup * 10 + currentWordIndex];
            currentWord = wordData.word;
            currentEmoji = wordData.emoji;
            enteredLetters = [];

            // Buchstaben mischen
            shuffledLetters = currentWord.split('').sort(() => Math.random() - 0.5);

            // UI aktualisieren
            document.getElementById('current-task').textContent = currentWordIndex + 1;
            document.getElementById('progress-fill').style.width = `${(currentWordIndex / 10) * 100}%`;
            document.getElementById('image-display').textContent = currentEmoji;

            renderWordSlots();
            renderLetterButtons();
        }

        // Wort-Slots rendern
        function renderWordSlots() {
            const container = document.getElementById('word-display');
            container.innerHTML = '';

            for (let i = 0; i < currentWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot' + (enteredLetters[i] ? ' filled' : '');
                slot.textContent = enteredLetters[i] || '';
                container.appendChild(slot);
            }
        }

        // Buchstaben-Buttons rendern
        function renderLetterButtons() {
            const container = document.getElementById('letter-buttons');
            container.innerHTML = '';

            shuffledLetters.forEach((letter, index) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.dataset.index = index;

                // Prüfen ob Buchstabe schon verwendet wurde
                const usedIndices = enteredLetters.map((_, i) => {
                    return shuffledLetters.findIndex((l, idx) => {
                        return l === enteredLetters[i] && !enteredLetters.slice(0, i).some((el, ei) =>
                            shuffledLetters.findIndex((sl, si) => sl === el && si === idx) === idx
                        );
                    });
                });

                if (enteredLetters.includes(letter) &&
                    enteredLetters.filter(l => l === letter).length >
                    shuffledLetters.slice(0, index).filter(l => l === letter).length -
                    enteredLetters.slice(0, enteredLetters.lastIndexOf(letter)).filter(l => l === letter).length) {
                    // Komplexere Logik für doppelte Buchstaben
                }

                btn.onclick = () => handleLetterClick(letter, btn, index);
                container.appendChild(btn);
            });

            updateUsedButtons();
        }

        // Button als benutzt markieren
        function updateUsedButtons() {
            const buttons = document.querySelectorAll('.letter-btn');
            const usedCounts = {};

            enteredLetters.forEach(letter => {
                usedCounts[letter] = (usedCounts[letter] || 0) + 1;
            });

            const buttonCounts = {};
            buttons.forEach(btn => {
                const letter = btn.textContent;
                buttonCounts[letter] = (buttonCounts[letter] || 0) + 1;

                const usedCount = usedCounts[letter] || 0;
                const buttonIndex = buttonCounts[letter];

                if (buttonIndex <= usedCount) {
                    btn.classList.add('used');
                } else {
                    btn.classList.remove('used');
                }
            });
        }

        // Buchstaben-Klick verarbeiten
        function handleLetterClick(letter, btn, index) {
            if (btn.classList.contains('used')) return;

            const expectedLetter = currentWord[enteredLetters.length];

            if (letter === expectedLetter) {
                // Richtig!
                enteredLetters.push(letter);
                btn.classList.add('used');
                renderWordSlots();
                updateUsedButtons();

                // Wort komplett?
                if (enteredLetters.length === currentWord.length) {
                    setTimeout(() => {
                        document.getElementById('success-overlay').classList.add('show');
                        // Automatisch nach 1.2 Sekunden weiter
                        setTimeout(() => {
                            nextWord();
                        }, 1200);
                    }, 300);
                }
            } else {
                // Falsch - Wackel-Animation
                btn.classList.add('wrong');
                setTimeout(() => {
                    btn.classList.remove('wrong');
                }, 500);
            }
        }

        // Nächstes Wort
        function nextWord() {
            document.getElementById('success-overlay').classList.remove('show');
            currentWordIndex++;

            if (currentWordIndex >= 10) {
                // Gruppe geschafft!
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('group-complete').classList.add('show');
            } else {
                loadWord();
            }
        }

        // Nächste Gruppe
        function nextGroup() {
            if (currentGroup < 9) {
                startGroup(currentGroup + 1);
            } else {
                goHome();
            }
        }

        // Wort überspringen
        function skipWord() {
            currentWordIndex++;
            if (currentWordIndex >= 10) {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('group-complete').classList.add('show');
            } else {
                loadWord();
            }
        }

        // Zurück zur Startseite
        function goHome() {
            document.getElementById('start-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('group-complete').classList.remove('show');
        }

        // Initialisieren
        initGroupButtons();

        // Service Worker registrieren (Offline-Faehigkeit)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
