<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#16a085"/>
  <!-- 4 Felder (3 gleich + 1 anders): Apfel oben links, Apfel oben rechts, Apfel unten links, Auto unten rechts -->
  <!-- oben links: Apfel -->
  <circle cx="160" cy="170" r="58" fill="#e74c3c"/>
  <rect x="155" y="100" width="10" height="20" fill="#7f5a32"/>
  <ellipse cx="180" cy="108" rx="14" ry="8" fill="#27ae60"/>
  <!-- oben rechts: Apfel -->
  <circle cx="352" cy="170" r="58" fill="#e74c3c"/>
  <rect x="347" y="100" width="10" height="20" fill="#7f5a32"/>
  <ellipse cx="372" cy="108" rx="14" ry="8" fill="#27ae60"/>
  <!-- unten links: Apfel -->
  <circle cx="160" cy="362" r="58" fill="#e74c3c"/>
  <rect x="155" y="292" width="10" height="20" fill="#7f5a32"/>
  <ellipse cx="180" cy="300" rx="14" ry="8" fill="#27ae60"/>
  <!-- unten rechts: kleines Auto (das nicht passt) -->
  <rect x="294" y="332" width="116" height="46" rx="10" fill="#3498db"/>
  <rect x="306" y="306" width="78" height="32" rx="8" fill="#3498db"/>
  <rect x="316" y="312" width="26" height="20" fill="#bde0fe"/>
  <rect x="350" y="312" width="26" height="20" fill="#bde0fe"/>
  <circle cx="318" cy="384" r="14" fill="#2c3e50"/>
  <circle cx="386" cy="384" r="14" fill="#2c3e50"/>
  <!-- Markierungs-Ring um den Aussenseiter -->
  <circle cx="352" cy="356" r="76" fill="none" stroke="#fff7d6" stroke-width="8" stroke-dasharray="6 8"/>
</svg>
