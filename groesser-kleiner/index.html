<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Größer oder kleiner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0277bd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Größer oder kleiner">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --color-primary: #0277bd;
      --color-light:   #9cccea;
      --color-dark:    #014d7a;
      --color-bg:      #e9f4fb;
      --color-success: #2e7d32;
      --color-error:   #c62828;
      --radius-card:   28px;
      --radius-btn:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Verdana', 'Tahoma', sans-serif;
      background: var(--color-bg);
      color: #2a2a2a;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .screen.hidden { display: none; }

    #screen-start {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center; align-items: center; padding-top: 20px; overflow-y: auto;
    }
    #screen-start .card {
      background: white; border-radius: var(--radius-card); padding: 32px 28px;
      max-width: 480px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.18); text-align: center;
    }
    #screen-start h1 { color: var(--color-primary); font-size: 2.2rem; margin-bottom: 6px; }
    #screen-start .sub { color: var(--color-dark); margin-bottom: 22px; font-size: 1rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--color-primary); text-decoration: none;
      font-size: 0.95rem; font-weight: bold; margin-bottom: 14px;
      padding: 8px 14px; border-radius: 12px; background: var(--color-light); transition: background 0.15s;
    }
    .back-link:hover, .back-link:focus { background: var(--color-bg); }

    .group { margin-bottom: 22px; text-align: left; }
    .group h2 { color: var(--color-primary); font-size: 1.05rem; margin-bottom: 10px; font-weight: bold; text-align: center; }
    .stage-list { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      background: var(--color-bg); border: 3px solid transparent; border-radius: var(--radius-btn);
      padding: 14px 16px; font-family: inherit; font-size: 1rem; color: var(--color-dark);
      cursor: pointer; text-align: left; transition: border-color 0.15s, transform 0.1s;
    }
    .choice:hover, .choice:focus { border-color: var(--color-primary); }
    .choice.selected { border-color: var(--color-primary); background: var(--color-light); }
    .choice:active { transform: scale(0.98); }

    .btn-primary {
      width: 100%; padding: 16px; background: var(--color-primary); color: white;
      border: none; border-radius: var(--radius-btn); font-family: inherit;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 8px; transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    #screen-game { background: var(--color-bg); padding-top: max(14px, env(safe-area-inset-top)); }

    .hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 6px 4px 14px; }
    .hud .stage { color: var(--color-dark); font-size: 0.9rem; font-weight: bold; justify-self: start; }
    .hud .progress {
      color: var(--color-primary); font-size: 1rem; font-weight: bold;
      padding: 6px 14px; background: white; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .hud .hud-btn {
      width: 44px; height: 44px; border: none; background: white; border-radius: 50%;
      font-size: 1.4rem; font-weight: bold; color: var(--color-primary); cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10); justify-self: end;
      display: flex; align-items: center; justify-content: center;
    }

    .play-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
    .hint { color: var(--color-dark); font-size: 0.95rem; text-align: center; max-width: 320px; }

    .compare-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .panel {
      background: white; border-radius: 24px; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      min-width: 116px; min-height: 140px; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .panel .digit { font-size: 4.6rem; font-weight: bold; color: var(--color-primary); line-height: 1; }
    .panel .dots { display: flex; flex-wrap: wrap; gap: 8px; max-width: 132px; justify-content: center; }
    .panel .dot {
      width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); animation: pop-in 0.25s ease both;
    }

    .gap {
      width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
      color: var(--color-primary); flex: none;
    }
    .gap .q { font-size: 3rem; font-weight: bold; color: var(--color-light); }
    .gap svg { width: 58px; height: 58px; animation: pop-in 0.3s ease both; }

    .sym-answers { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .sym-btn {
      width: 100px; min-height: 106px; border: none; border-radius: 20px; background: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15); cursor: pointer; color: var(--color-primary);
      font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      transition: transform 0.1s;
    }
    .sym-btn:active { transform: scale(0.96); }
    .sym-btn svg { width: 54px; height: 54px; }
    .sym-btn .lbl { font-size: 0.82rem; font-weight: bold; color: var(--color-dark); }
    .sym-btn.correct { animation: correct-pulse 0.5s ease; background: #e8f5e9; color: var(--color-success); }
    .sym-btn.correct .lbl { color: var(--color-success); }
    .sym-btn.wrong   { animation: wrong-wiggle 0.45s ease; }
    .sym-btn:disabled { cursor: default; }

    #screen-end { background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%); justify-content: center; align-items: center; }
    #screen-end .card {
      background: white; border-radius: var(--radius-card); padding: 32px 28px;
      max-width: 480px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.18); text-align: center;
    }
    #screen-end h2 { color: var(--color-primary); font-size: 1.8rem; margin-bottom: 10px; }
    #screen-end p { color: var(--color-dark); margin-bottom: 22px; }
    #screen-end .actions { display: flex; flex-direction: column; gap: 10px; }
    #screen-end .btn-secondary {
      padding: 14px; background: white; color: var(--color-primary);
      border: 2px solid var(--color-primary); border-radius: var(--radius-btn);
      font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; display: block;
    }

    @keyframes correct-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes wrong-wiggle {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
    .fade-in { animation: fade-in 0.25s ease; }

    button:focus-visible, a:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 380px) {
      #screen-start h1 { font-size: 1.8rem; }
      .panel { min-width: 96px; min-height: 120px; }
      .panel .digit { font-size: 3.8rem; }
      .sym-btn { width: 88px; }
    }
  </style>
</head>
<body>

  <!-- ====================== START-SCREEN ====================== -->
  <div id="screen-start" class="screen">
    <div class="card">
      <a href="../" class="back-link" aria-label="Zurueck zur Spiele-Uebersicht">&larr; Übersicht</a>
      <h1>Größer oder kleiner</h1>
      <p class="sub">Das Krokodil-Maul frisst immer die größere Seite.</p>

      <div class="group">
        <h2>Stufe wählen</h2>
        <div class="stage-list" role="radiogroup" aria-label="Schwierigkeitsstufe">
          <button class="choice selected" data-stage="leicht" role="radio" aria-checked="true">Leicht — Mengen vergleichen</button>
          <button class="choice"          data-stage="mittel" role="radio" aria-checked="false">Mittel — Zahlen bis 10</button>
          <button class="choice"          data-stage="schwer" role="radio" aria-checked="false">Schwer — Zahlen bis 20</button>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">Los geht's</button>
    </div>
  </div>

  <!-- ====================== GAME-SCREEN ====================== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="stage" id="hud-stage">Leicht</span>
      <span class="progress" id="hud-progress">Aufgabe 1/8</span>
      <button class="hud-btn" id="hud-close" aria-label="Spiel beenden, zurueck zum Start">×</button>
    </div>

    <div class="play-area">
      <p class="hint">Welches Zeichen passt zwischen die beiden Seiten?</p>
      <div class="compare-row">
        <div class="panel" id="panel-left"></div>
        <div class="gap" id="gap"><span class="q">?</span></div>
        <div class="panel" id="panel-right"></div>
      </div>
      <div class="sym-answers" id="answers"></div>
    </div>
  </div>

  <!-- ====================== END-SCREEN ====================== -->
  <div id="screen-end" class="screen hidden">
    <div class="card">
      <h2 id="end-title">Schöne Runde!</h2>
      <p id="end-message">Magst du nochmal?</p>
      <div class="actions">
        <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
        <button class="btn-secondary" id="btn-restage">Andere Stufe</button>
        <a class="btn-secondary" href="../">Zur Übersicht</a>
      </div>
    </div>
  </div>

  <script src="../_lib/audio.js"></script>
  <script>
    'use strict';

    const GAME_ID = 'groesser-kleiner';
    const PREFS_KEY = GAME_ID + '-prefs';
    const ROUND = 8;

    const STAGE_CONFIG = {
      leicht: { label: 'Leicht', mode: 'mengen', max: 9 },
      mittel: { label: 'Mittel', mode: 'zahl',   max: 10 },
      schwer: { label: 'Schwer', mode: 'zahl',   max: 20 }
    };

    // Antwort-Reihenfolge: kleiner (<), gleich (=), groesser (>)
    const ANSWERS = [
      { rel: 'lt', label: 'kleiner' },
      { rel: 'eq', label: 'gleich' },
      { rel: 'gt', label: 'größer' }
    ];

    const state = { stage: 'leicht', taskIdx: 0, rel: 'lt', locked: false };

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function loadPrefs() { try { const r = localStorage.getItem(PREFS_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
    function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) {} }

    // Vergleichszeichen als kleines Krokodil-Maul (offene Seite zeigt zur groesseren Zahl)
    function symSVG(rel) {
      if (rel === 'eq') {
        return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
          '<rect x="20" y="38" width="60" height="12" rx="6" fill="currentColor"/>' +
          '<rect x="20" y="58" width="60" height="12" rx="6" fill="currentColor"/></svg>';
      }
      if (rel === 'lt') { // "<" : Maul offen nach rechts
        return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
          '<polyline points="68,16 30,50 68,84" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<circle cx="40" cy="34" r="5.5" fill="currentColor"/></svg>';
      }
      // "gt" ">" : Maul offen nach links
      return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
        '<polyline points="32,16 70,50 32,84" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="60" cy="34" r="5.5" fill="currentColor"/></svg>';
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.add('hidden'); });
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('fade-in');
      setTimeout(function () { el.classList.remove('fade-in'); }, 300);
    }

    function initStartScreen() {
      const prefs = loadPrefs();
      if (prefs.stage && STAGE_CONFIG[prefs.stage]) state.stage = prefs.stage;

      document.querySelectorAll('#screen-start .choice').forEach(function (btn) {
        btn.classList.toggle('selected', btn.dataset.stage === state.stage);
        btn.setAttribute('aria-checked', String(btn.dataset.stage === state.stage));
        btn.addEventListener('click', function () {
          state.stage = btn.dataset.stage;
          document.querySelectorAll('#screen-start .choice').forEach(function (b) {
            b.classList.toggle('selected', b === btn);
            b.setAttribute('aria-checked', String(b === btn));
          });
          savePrefs({ stage: state.stage });
        });
      });
      document.getElementById('btn-start').addEventListener('click', startGame);
    }

    function startGame() {
      state.taskIdx = 0;
      showScreen('screen-game');
      document.getElementById('hud-stage').textContent = STAGE_CONFIG[state.stage].label;
      nextTask();
    }

    function renderPanel(el, value, mode) {
      el.innerHTML = '';
      if (mode === 'mengen') {
        const wrap = document.createElement('div');
        wrap.className = 'dots';
        for (let i = 0; i < value; i++) {
          const d = document.createElement('div');
          d.className = 'dot';
          d.style.animationDelay = (i * 0.03) + 's';
          wrap.appendChild(d);
        }
        el.appendChild(wrap);
      } else {
        const dg = document.createElement('div');
        dg.className = 'digit';
        dg.textContent = value;
        el.appendChild(dg);
      }
      el.setAttribute('aria-label', value + (mode === 'mengen' ? ' Punkte' : ''));
    }

    function nextTask() {
      const cfg = STAGE_CONFIG[state.stage];
      if (state.taskIdx >= ROUND) { endGame(); return; }
      state.taskIdx++;
      state.locked = false;
      document.getElementById('hud-progress').textContent = 'Aufgabe ' + state.taskIdx + '/' + ROUND;

      let L, R;
      if (Math.random() < 0.25) {
        L = R = randInt(1, cfg.max);
      } else {
        L = randInt(1, cfg.max);
        R = randInt(1, cfg.max);
        while (R === L) R = randInt(1, cfg.max);
      }
      state.rel = L < R ? 'lt' : (L > R ? 'gt' : 'eq');

      renderPanel(document.getElementById('panel-left'), L, cfg.mode);
      renderPanel(document.getElementById('panel-right'), R, cfg.mode);

      const gap = document.getElementById('gap');
      gap.innerHTML = '<span class="q">?</span>';

      const answersEl = document.getElementById('answers');
      answersEl.innerHTML = '';
      ANSWERS.forEach(function (a) {
        const btn = document.createElement('button');
        btn.className = 'sym-btn';
        btn.innerHTML = symSVG(a.rel) + '<span class="lbl">' + a.label + '</span>';
        btn.setAttribute('aria-label', a.label);
        btn.addEventListener('click', function () { onAnswer(btn, a.rel); });
        answersEl.appendChild(btn);
      });
    }

    function onAnswer(btn, rel) {
      if (state.locked) return;
      if (rel === state.rel) {
        state.locked = true;
        btn.classList.add('correct');
        document.querySelectorAll('.sym-btn').forEach(function (b) { b.disabled = true; });
        document.getElementById('gap').innerHTML = symSVG(rel);
        Lernspiele.Audio.correct();
        setTimeout(nextTask, 950);
      } else {
        btn.classList.add('wrong');
        Lernspiele.Audio.wrong();
        setTimeout(function () { btn.classList.remove('wrong'); }, 500);
      }
    }

    function endGame() {
      showScreen('screen-end');
      document.getElementById('btn-replay').onclick = startGame;
      document.getElementById('btn-restage').onclick = function () { showScreen('screen-start'); };
    }

    document.getElementById('hud-close').addEventListener('click', function () { showScreen('screen-start'); });
    document.addEventListener('pointerdown', function () {
      if (window.Lernspiele && Lernspiele.Audio) Lernspiele.Audio.ensure();
    }, { once: true });

    initStartScreen();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
