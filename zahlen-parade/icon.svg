  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Tor links (orange, +2) -->
  <path d="M 110 230 Q 110 170 165 170 Q 220 170 220 230 L 220 340 L 110 340 Z"
