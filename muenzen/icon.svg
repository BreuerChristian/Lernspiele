<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hintergrund mit Gold-Pastell-Verlauf -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8a6300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Gestapelte Munzen, von hinten nach vorne, mit leichter Versetzung -->

  <!-- Münze 1 (hinten): 1 Euro (silber-mit-gold-rand bicolor) -->
  <g transform="translate(160,140)">
    <circle cx="100" cy="100" r="92" fill="#a8a8b0" stroke="#5a5a60" stroke-width="3"/>
    <circle cx="100" cy="100" r="80" fill="#cfcfd6" opacity="0.6"/>
    <circle cx="100" cy="100" r="58" fill="#e8be3c" stroke="#a07a00" stroke-width="2"/>
    <ellipse cx="78" cy="72" rx="28" ry="14" fill="white" opacity="0.32"/>
    <text x="100" y="116" text-anchor="middle" font-family="Verdana, Tahoma, sans-serif" font-size="56" font-weight="bold" fill="#3a2a08">1€</text>
  </g>

  <!-- Münze 2 (Mitte rechts): 50 Cent (gold) -->
  <g transform="translate(280,210)">
    <circle cx="80" cy="80" r="74" fill="#d4a017" stroke="#7a5800" stroke-width="3"/>
    <circle cx="80" cy="80" r="62" fill="#e8be3c" opacity="0.55"/>
    <ellipse cx="62" cy="58" rx="22" ry="12" fill="white" opacity="0.32"/>
    <text x="80" y="94" text-anchor="middle" font-family="Verdana, Tahoma, sans-serif" font-size="36" font-weight="bold" fill="#3a2a08">50c</text>
  </g>

  <!-- Münze 3 (Mitte links unten): 5 Cent (kupfer) -->
  <g transform="translate(80,260)">
    <circle cx="70" cy="70" r="64" fill="#c4733a" stroke="#7a3a0a" stroke-width="3"/>
    <circle cx="70" cy="70" r="54" fill="#dd955a" opacity="0.55"/>
    <ellipse cx="54" cy="50" rx="20" ry="11" fill="white" opacity="0.32"/>
    <text x="70" y="84" text-anchor="middle" font-family="Verdana, Tahoma, sans-serif" font-size="36" font-weight="bold" fill="#3a2a08">5c</text>
  </g>

  <!-- Münze 4 (vorn rechts unten): 2 Euro (gold-mit-silber bicolor) -->
  <g transform="translate(240,330)">
    <circle cx="80" cy="80" r="74" fill="#d4a017" stroke="#7a5800" stroke-width="3"/>
    <circle cx="80" cy="80" r="64" fill="#e8be3c" opacity="0.6"/>
    <circle cx="80" cy="80" r="46" fill="#cfcfd6" stroke="#7a7a80" stroke-width="2"/>
    <ellipse cx="62" cy="58" rx="22" ry="12" fill="white" opacity="0.32"/>
    <text x="80" y="94" text-anchor="middle" font-family="Verdana, Tahoma, sans-serif" font-size="36" font-weight="bold" fill="#3a3a40">2€</text>
  </g>
</svg>
