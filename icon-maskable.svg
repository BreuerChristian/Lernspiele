<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6f44"/>
      <stop offset="100%" stop-color="#2c5234"/>
    </linearGradient>
  </defs>
  <!-- Vollfläche (kein rx — maskable wird vom System geclippt) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <!-- Inhalt im 80%-Safe-Bereich (102..410) -->
  <!-- Holzrahmen -->
  <rect x="120" y="170" width="272" height="200" rx="18" fill="#a8763d"/>
  <rect x="132" y="182" width="248" height="176" rx="12" fill="#8a5a26"/>
  <!-- Tafel -->
  <rect x="142" y="192" width="228" height="156" rx="6" fill="url(#boardGrad)"/>
  <!-- Buchstaben-Reihe -->
  <text x="256" y="246" font-family="Verdana, sans-serif" font-size="64" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="4">
    <tspan fill="#ff8a65">A</tspan><tspan fill="#fff176">B</tspan><tspan fill="#81d4fa">C</tspan>
  </text>
  <!-- Zahlen-Reihe -->
  <text x="256" y="312" font-family="Verdana, sans-serif" font-size="56" font-weight="bold"
        text-anchor="middle" dominant-baseline="central" letter-spacing="10">
    <tspan fill="#a5d6a7">1</tspan><tspan fill="#f48fb1">2</tspan><tspan fill="#ffd54f">3</tspan>
  </text>
</svg>
