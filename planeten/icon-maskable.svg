<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vollflaechiger Hintergrund (kein border-radius - wird vom OS maskiert) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3a2476"/>
      <stop offset="100%" stop-color="#0b1030"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c2"/>
      <stop offset="55%" stop-color="#ffce4a"/>
      <stop offset="100%" stop-color="#e07a1a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Inhalt innerhalb 80% Safe-Zone (51..461) -->
  <g fill="white">
    <circle cx="120" cy="120" r="2"/>
    <circle cx="400" cy="160" r="1.8"/>
    <circle cx="150" cy="380" r="1.8"/>
    <circle cx="380" cy="400" r="2"/>
  </g>
  <!-- Bahn -->
  <ellipse cx="256" cy="256" rx="150" ry="70" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <!-- Sonne (mittig, in Safe-Zone) -->
  <circle cx="256" cy="256" r="52" fill="url(#sun)"/>
  <!-- Erde rechts auf Bahn -->
  <circle cx="402" cy="256" r="13" fill="#3a8fd6"/>
  <!-- Saturn links auf Bahn -->
  <g transform="translate(110 256)">
    <ellipse cx="0" cy="0" rx="32" ry="8" fill="none" stroke="#e6c878" stroke-width="4"/>
    <circle cx="0" cy="0" r="17" fill="#e8b95c"/>
    <ellipse cx="0" cy="0" rx="32" ry="8" fill="none" stroke="#e6c878" stroke-width="4" stroke-dasharray="50 200" stroke-dashoffset="-25"/>
  </g>
</svg>
