name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Regeln, Syntax & Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regel-Linter (Leitprinzipien, HUD, SW, Manifest)
        run: python scripts/check-spiele.py
      - name: JS-Syntaxpruefung
        run: python scripts/check-syntax.py
      - name: Landing/SW/Doku in sync mit games.json
        run: python scripts/sync-games.py --check

  smoke:
    name: Headless-Durchlauf (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright + Chromium installieren
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Smoke-Test aller Spiele
        run: node scripts/smoke-test.mjs
