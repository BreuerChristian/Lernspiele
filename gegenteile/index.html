<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Gegenteile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#d35400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gegenteile">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --color-primary: #d35400;
      --color-light:   #edba99;
      --color-dark:    #893600;
      --color-bg:      #f9eae0;
      --color-success: #2e7d32;
      --color-error:   #c62828;
      --radius-card:   28px;
      --radius-btn:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Verdana', 'Tahoma', sans-serif;
      background: var(--color-bg);
      color: #2a2a2a;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ---------- Screens ---------- */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .screen.hidden { display: none; }

    /* ---------- Start-Screen ---------- */
    #screen-start {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center;
      align-items: center;
      padding-top: 20px;
      overflow-y: auto;
    }
    #screen-start .card {
      background: white;
      border-radius: var(--radius-card);
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      text-align: center;
    }
    #screen-start h1 {
      color: var(--color-primary);
      font-size: 2.2rem;
      margin-bottom: 6px;
    }
    #screen-start .sub {
      color: var(--color-dark);
      margin-bottom: 22px;
      font-size: 1rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 14px;
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--color-light);
      transition: background 0.15s;
    }
    .back-link:hover, .back-link:focus { background: var(--color-bg); }

    .group { margin-bottom: 22px; text-align: left; }
    .group h2 {
      color: var(--color-primary);
      font-size: 1.05rem;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
    }
    .stage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice {
      background: var(--color-bg);
      border: 3px solid transparent;
      border-radius: var(--radius-btn);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--color-dark);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, transform 0.1s;
    }
    .choice:hover, .choice:focus {
      border-color: var(--color-primary);
    }
    .choice.selected {
      border-color: var(--color-primary);
      background: var(--color-light);
    }
    .choice:active { transform: scale(0.98); }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- Game-Screen ---------- */
    #screen-game {
      background: var(--color-bg);
      padding-top: max(14px, env(safe-area-inset-top));
    }

    /* HUD: links Stufe | Mitte Fortschritt | rechts Schliessen */
    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 6px 4px 14px;
    }
    .hud .stage {
      color: var(--color-dark);
      font-size: 0.9rem;
      font-weight: bold;
      justify-self: start;
    }
    .hud .progress {
      color: var(--color-primary);
      font-size: 1rem;
      font-weight: bold;
      padding: 6px 14px;
      background: white;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .hud .hud-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: white;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--color-primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .question {
      font-size: 1.4rem;
      color: var(--color-dark);
      text-align: center;
    }
    .answers {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .answer {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .answer:active { transform: scale(0.96); }
    .answer.correct { animation: correct-pulse 0.5s ease; }
    .answer.wrong   { animation: wrong-wiggle 0.45s ease; }

    /* ---------- End-Screen ---------- */
    #screen-end {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center;
      align-items: center;
    }
    #screen-end .card {
      background: white;
      border-radius: var(--radius-card);
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      text-align: center;
    }
    #screen-end h2 {
      color: var(--color-primary);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    #screen-end p {
      color: var(--color-dark);
      margin-bottom: 22px;
    }
    #screen-end .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #screen-end .btn-secondary {
      padding: 14px;
      background: white;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    /* ---------- Standard-Animationen ---------- */
    @keyframes correct-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }
    @keyframes wrong-wiggle {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fade-in 0.25s ease; }

    /* ---------- Accessibility ---------- */
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 380px) {
      #screen-start h1 { font-size: 1.8rem; }
      .answer { width: 80px; height: 80px; }
    }

    /* ---------- Gegenteile-spezifisch ---------- */
    .prompt-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
      padding: 18px 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .prompt-card svg { width: 120px; height: 120px; display: block; color: var(--color-primary); }
    .prompt-word {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--color-dark);
    }
    .answers { gap: 14px; flex-wrap: wrap; }
    .answer.answer-card {
      width: auto; height: auto;
      background: white;
      border: 3px solid var(--color-primary);
      border-radius: var(--radius-btn);
      box-shadow: 0 4px 10px rgba(0,0,0,0.10);
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .answer.answer-card svg { width: 80px; height: 80px; display: block; pointer-events: none; color: var(--color-primary); }
    .answer.answer-card .ans-word {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--color-dark);
      pointer-events: none;
    }
    .answer.answer-card.correct {
      background: var(--color-light);
      border-color: var(--color-dark);
    }
    .question { font-size: 1.3rem; }
    @media (max-width: 380px) {
      .prompt-card svg { width: 96px; height: 96px; }
      .answer.answer-card svg { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

  <!-- ====================== START-SCREEN ====================== -->
  <div id="screen-start" class="screen">
    <div class="card">
      <a href="../" class="back-link" aria-label="Zurueck zur Spiele-Uebersicht">&larr; Übersicht</a>
      <h1>Gegenteile</h1>
      <p class="sub">Finde das passende Gegenteil</p>

      <div class="group">
        <h2>Stufe waehlen</h2>
        <div class="stage-list" role="radiogroup" aria-label="Schwierigkeitsstufe">
          <button class="choice selected" data-stage="leicht" role="radio" aria-checked="true">Leicht — 2 Bilder</button>
          <button class="choice"          data-stage="mittel" role="radio" aria-checked="false">Mittel — 3 Bilder</button>
          <button class="choice"          data-stage="schwer" role="radio" aria-checked="false">Schwer — 4 Bilder</button>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">Los geht's</button>
    </div>
  </div>

  <!-- ====================== GAME-SCREEN ====================== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="stage" id="hud-stage">Leicht</span>
      <span class="progress" id="hud-progress">Aufgabe 1/5</span>
      <button class="hud-btn" id="hud-close" aria-label="Spiel beenden, zurueck zum Start">×</button>
    </div>

    <div class="play-area">
      <div class="prompt-card">
        <div id="prompt-svg" aria-hidden="true"></div>
        <div class="prompt-word" id="prompt-word"></div>
      </div>
      <div class="question" id="question">Was ist das Gegenteil?</div>
      <div class="answers" id="answers"></div>
    </div>
  </div>

  <!-- ====================== END-SCREEN ====================== -->
  <div id="screen-end" class="screen hidden">
    <div class="card">
      <h2 id="end-title">Schoene Runde!</h2>
      <p id="end-message">Du hast alle Aufgaben gemacht.</p>
      <div class="actions">
        <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
        <button class="btn-secondary" id="btn-restage">Andere Stufe</button>
        <a class="btn-secondary" href="../">Zur Übersicht</a>
      </div>
    </div>
  </div>

  <!-- ====================== AUDIO-LIB ====================== -->
  <script src="../_lib/audio.js"></script>

  <!-- ====================== SPIEL-LOGIK ====================== -->
  <script>
    'use strict';

    const GAME_ID = 'gegenteile';
    const PREFS_KEY = GAME_ID + '-prefs';

    // --- Gegenteil-Konzepte: jedes hat ein Wort und eine gezeichnete Illustration.
    //     Farben erben ueber currentColor die Theme-Farbe. ---
    const CONCEPTS = {
      gross:   { word: 'groß',    svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="currentColor"/></svg>' },
      klein:   { word: 'klein',   svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="13" fill="currentColor"/></svg>' },
      lang:    { word: 'lang',    svg: '<svg viewBox="0 0 100 100"><rect x="8" y="42" width="84" height="16" rx="8" fill="currentColor"/></svg>' },
      kurz:    { word: 'kurz',    svg: '<svg viewBox="0 0 100 100"><rect x="35" y="42" width="30" height="16" rx="8" fill="currentColor"/></svg>' },
      voll:    { word: 'voll',    svg: '<svg viewBox="0 0 100 100"><path d="M30 14 L70 14 L64 86 L36 86 Z" fill="none" stroke="currentColor" stroke-width="4"/><path d="M32 22 L68 22 L63 82 L37 82 Z" fill="currentColor"/></svg>' },
      leer:    { word: 'leer',    svg: '<svg viewBox="0 0 100 100"><path d="M30 14 L70 14 L64 86 L36 86 Z" fill="none" stroke="currentColor" stroke-width="4"/></svg>' },
      dick:    { word: 'dick',    svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill="none" stroke="currentColor" stroke-width="24"/></svg>' },
      duenn:   { word: 'dünn',    svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="5"/></svg>' },
      viel:    { word: 'viel',    svg: '<svg viewBox="0 0 100 100"><g fill="currentColor"><circle cx="26" cy="26" r="9"/><circle cx="50" cy="26" r="9"/><circle cx="74" cy="26" r="9"/><circle cx="26" cy="50" r="9"/><circle cx="50" cy="50" r="9"/><circle cx="74" cy="50" r="9"/><circle cx="26" cy="74" r="9"/><circle cx="50" cy="74" r="9"/><circle cx="74" cy="74" r="9"/></g></svg>' },
      wenig:   { word: 'wenig',   svg: '<svg viewBox="0 0 100 100"><g fill="currentColor"><circle cx="38" cy="50" r="9"/><circle cx="62" cy="50" r="9"/></g></svg>' },
      oben:    { word: 'oben',    svg: '<svg viewBox="0 0 100 100"><path d="M50 14 L84 54 L62 54 L62 86 L38 86 L38 54 L16 54 Z" fill="currentColor"/></svg>' },
      unten:   { word: 'unten',   svg: '<svg viewBox="0 0 100 100"><path d="M50 86 L84 46 L62 46 L62 14 L38 14 L38 46 L16 46 Z" fill="currentColor"/></svg>' },
      auf:     { word: 'auf',     svg: '<svg viewBox="0 0 100 100"><rect x="28" y="48" width="44" height="38" rx="6" fill="currentColor"/><path d="M36 48 V34 a14 14 0 0 1 28 0" fill="none" stroke="currentColor" stroke-width="7"/></svg>' },
      zu:      { word: 'zu',      svg: '<svg viewBox="0 0 100 100"><rect x="28" y="48" width="44" height="38" rx="6" fill="currentColor"/><path d="M36 48 V34 a14 14 0 0 1 28 0 V48" fill="none" stroke="currentColor" stroke-width="7"/></svg>' },
      hell:    { word: 'hell',    svg: '<svg viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="50" y1="8" x2="50" y2="20"/><line x1="50" y1="80" x2="50" y2="92"/><line x1="8" y1="50" x2="20" y2="50"/><line x1="80" y1="50" x2="92" y2="50"/><line x1="21" y1="21" x2="30" y2="30"/><line x1="70" y1="70" x2="79" y2="79"/><line x1="79" y1="21" x2="70" y2="30"/><line x1="30" y1="70" x2="21" y2="79"/></g><circle cx="50" cy="50" r="20" fill="currentColor"/></svg>' },
      dunkel:  { word: 'dunkel',  svg: '<svg viewBox="0 0 100 100"><path d="M64 18 a34 34 0 1 0 0 64 a26 26 0 1 1 0 -64 Z" fill="currentColor"/></svg>' }
    };

    // Gegenteil-Paare (beide Richtungen werden automatisch gebildet)
    const PAIRS = [
      ['gross', 'klein'],
      ['lang', 'kurz'],
      ['voll', 'leer'],
      ['dick', 'duenn'],
      ['viel', 'wenig'],
      ['oben', 'unten'],
      ['auf', 'zu'],
      ['hell', 'dunkel']
    ];
    const OPPOSITE = {};
    PAIRS.forEach(function (p) { OPPOSITE[p[0]] = p[1]; OPPOSITE[p[1]] = p[0]; });
    const ALL_KEYS = Object.keys(CONCEPTS);

    const STAGE_CONFIG = {
      leicht: { label: 'Leicht', count: 2, runde: 8 },
      mittel: { label: 'Mittel', count: 3, runde: 8 },
      schwer: { label: 'Schwer', count: 4, runde: 10 }
    };

    const state = { stage: 'leicht', taskIdx: 0, target: null, locked: false, recent: [] };

    // --- LocalStorage ---
    function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } }
    function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) {} }

    // --- Helpers ---
    function shuffle(a) { return a.slice().sort(function () { return Math.random() - 0.5; }); }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.add('hidden'); });
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('fade-in');
      setTimeout(function () { el.classList.remove('fade-in'); }, 300);
    }

    // --- Start-Screen ---
    function initStartScreen() {
      const prefs = loadPrefs();
      if (prefs.stage && STAGE_CONFIG[prefs.stage]) state.stage = prefs.stage;

      document.querySelectorAll('#screen-start .choice').forEach(function (btn) {
        btn.classList.toggle('selected', btn.dataset.stage === state.stage);
        btn.setAttribute('aria-checked', String(btn.dataset.stage === state.stage));
        btn.addEventListener('click', function () {
          state.stage = btn.dataset.stage;
          document.querySelectorAll('#screen-start .choice').forEach(function (b) {
            b.classList.toggle('selected', b === btn);
            b.setAttribute('aria-checked', String(b === btn));
          });
          savePrefs({ stage: state.stage });
        });
      });

      document.getElementById('btn-start').addEventListener('click', startGame);
    }

    // --- Game-Screen ---
    function startGame() {
      state.taskIdx = 0;
      state.recent = [];
      showScreen('screen-game');
      document.getElementById('hud-stage').textContent = STAGE_CONFIG[state.stage].label;
      nextTask();
    }

    function nextTask() {
      const cfg = STAGE_CONFIG[state.stage];
      if (state.taskIdx >= cfg.runde) { endGame(); return; }
      state.taskIdx++;
      state.locked = false;
      document.getElementById('hud-progress').textContent = 'Aufgabe ' + state.taskIdx + '/' + cfg.runde;

      // Prompt-Konzept waehlen (nicht zuletzt gezeigte wiederholen)
      let promptPool = ALL_KEYS.filter(function (k) { return state.recent.indexOf(k) === -1; });
      if (promptPool.length < 2) promptPool = ALL_KEYS;
      const promptKey = pick(promptPool);
      const correctKey = OPPOSITE[promptKey];
      state.target = correctKey;
      state.recent = [promptKey].concat(state.recent).slice(0, 5);

      // Distraktoren: andere Konzepte, nie das Prompt- oder Loesungs-Konzept
      const distractPool = shuffle(ALL_KEYS.filter(function (k) {
        return k !== promptKey && k !== correctKey;
      })).slice(0, cfg.count - 1);
      const options = shuffle([correctKey].concat(distractPool));

      document.getElementById('prompt-svg').innerHTML = CONCEPTS[promptKey].svg;
      document.getElementById('prompt-word').textContent = CONCEPTS[promptKey].word;
      document.getElementById('question').textContent = 'Was ist das Gegenteil von „' + CONCEPTS[promptKey].word + '“?';

      const answersEl = document.getElementById('answers');
      answersEl.innerHTML = '';
      options.forEach(function (key) {
        const btn = document.createElement('button');
        btn.className = 'answer answer-card';
        btn.innerHTML = CONCEPTS[key].svg + '<span class="ans-word">' + CONCEPTS[key].word + '</span>';
        btn.setAttribute('aria-label', CONCEPTS[key].word);
        btn.addEventListener('click', function () { onAnswer(btn, key); });
        answersEl.appendChild(btn);
      });
    }

    function onAnswer(btn, key) {
      if (state.locked) return;
      if (key === state.target) {
        state.locked = true;
        btn.classList.add('correct');
        Lernspiele.Audio.correct();
        setTimeout(nextTask, 750);
      } else {
        btn.classList.add('wrong');
        Lernspiele.Audio.wrong();
        setTimeout(function () { btn.classList.remove('wrong'); }, 500);
      }
    }

    // --- End-Screen ---
    function endGame() {
      showScreen('screen-end');
      document.getElementById('end-title').textContent = 'Schöne Runde!';
      document.getElementById('end-message').textContent = 'Du hast alle Gegenteile gefunden. Magst du nochmal?';
      document.getElementById('btn-replay').onclick = startGame;
      document.getElementById('btn-restage').onclick = function () { showScreen('screen-start'); };
    }

    // --- HUD ---
    document.getElementById('hud-close').addEventListener('click', function () {
      showScreen('screen-start');
    });

    // --- Audio einmal beim ersten Tap warmlaufen lassen (iOS-Anforderung) ---
    document.addEventListener('pointerdown', function () {
      if (window.Lernspiele && Lernspiele.Audio) Lernspiele.Audio.ensure();
    }, { once: true });

    // --- Init ---
    initStartScreen();

    // --- Service Worker ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
