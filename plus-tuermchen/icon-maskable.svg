<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vollflaechiger Hintergrund (kein border-radius - wird vom OS maskiert) -->
  <rect width="512" height="512" fill="#d84315"/>
  <!-- Inhalt innerhalb 80% Safe-Zone (256 +/- 205, also 51..461) -->
  <!-- Linker Stapel (2 Kloetzchen) -->
  <g>
    <rect x="120" y="320" width="80" height="56" rx="9" fill="#ffd54f" stroke="#9a7a1a" stroke-width="3"/>
    <rect x="140" y="313" width="40" height="7"  rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="120" y="256" width="80" height="56" rx="9" fill="#aed581" stroke="#5b8a36" stroke-width="3"/>
    <rect x="140" y="249" width="40" height="7"  rx="2" fill="rgba(255,255,255,0.6)"/>
  </g>
  <!-- Plus-Symbol -->
  <g fill="white">
    <rect x="232" y="294" width="48" height="14" rx="6"/>
    <rect x="249" y="277" width="14" height="48" rx="6"/>
  </g>
  <!-- Rechter Stapel (3 Kloetzchen) -->
  <g>
    <rect x="312" y="320" width="80" height="56" rx="9" fill="#4dd0e1" stroke="#1a7280" stroke-width="3"/>
    <rect x="332" y="313" width="40" height="7"  rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="312" y="256" width="80" height="56" rx="9" fill="#ba68c8" stroke="#6b3a78" stroke-width="3"/>
    <rect x="332" y="249" width="40" height="7"  rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="312" y="192" width="80" height="56" rx="9" fill="#ef5350" stroke="#9a2a28" stroke-width="3"/>
    <rect x="332" y="185" width="40" height="7"  rx="2" fill="rgba(255,255,255,0.6)"/>
  </g>
  <!-- Bodenlinie -->
  <rect x="112" y="384" width="288" height="6" rx="3" fill="rgba(255,255,255,0.45)"/>
</svg>
