<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lernspiele für Kinder</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#764ba2">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #764ba2;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #667eea;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        .games {
            display: grid;
            gap: 18px;
            margin-bottom: 35px;
        }

        .game-card {
            display: block;
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 25px 20px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(118, 75, 162, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover,
        .game-card:focus {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(118, 75, 162, 0.4);
            outline: none;
        }

        .game-card .desc {
            display: block;
            font-size: 0.95rem;
            font-weight: normal;
            margin-top: 6px;
            opacity: 0.9;
        }

        footer {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        footer a {
            color: #764ba2;
            text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .container { padding: 25px 18px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lernspiele</h1>
        <p class="subtitle">Werbefrei. Open Source. Für Kinder.</p>

        <nav class="games">
            <a class="game-card" href="buchstaben/">
                Buchstaben-Spiel
                <span class="desc">Buchstaben hören und erkennen</span>
            </a>
        </nav>

        <footer>
            Keine Werbung &middot; Keine Tracker &middot; Offline spielbar<br>
            <a href="https://github.com/BreuerChristian/Lernspiele" rel="noopener">Quellcode auf GitHub</a>
        </footer>
    </div>
</body>
</html>
