<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Dame</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#a0522d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dame">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --color-primary: #a0522d;
      --color-light:   #d9b9ab;
      --color-dark:    #68351d;
      --color-bg:      #f3eae5;
      --sq-light: #f0dcc0;
      --sq-dark:  #99633c;
      --p1:      #f8f0e0;  --p1-border: #6b3410;  /* Hell */
      --p2:      #c62828;  --p2-border: #7a1616;  /* Rot */
      --king:    #ffca28;
      --radius-card:   28px;
      --radius-btn:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Verdana', 'Tahoma', sans-serif;
      background: var(--color-bg); color: #2a2a2a;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }

    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .screen.hidden { display: none; }

    /* ---------- Start-Screen ---------- */
    #screen-start {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center; align-items: center; padding-top: 20px; overflow-y: auto;
    }
    #screen-start .card {
      background: white; border-radius: var(--radius-card); padding: 32px 28px;
      max-width: 480px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.18); text-align: center;
    }
    #screen-start h1 { color: var(--color-primary); font-size: 2.2rem; margin-bottom: 6px; }
    #screen-start .sub { color: var(--color-dark); margin-bottom: 22px; font-size: 1rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary);
      text-decoration: none; font-size: 0.95rem; font-weight: bold; margin-bottom: 14px;
      padding: 8px 14px; border-radius: 12px; background: var(--color-light); transition: background 0.15s;
    }
    .back-link:hover, .back-link:focus { background: var(--color-bg); }

    .group { margin-bottom: 20px; text-align: left; }
    .group h2 { color: var(--color-primary); font-size: 1.05rem; margin-bottom: 10px; font-weight: bold; text-align: center; }
    .stage-list { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      background: var(--color-bg); border: 3px solid transparent; border-radius: var(--radius-btn);
      padding: 14px 16px; font-family: inherit; font-size: 1rem; color: var(--color-dark);
      cursor: pointer; text-align: left; transition: border-color 0.15s, transform 0.1s;
    }
    .choice:hover, .choice:focus { border-color: var(--color-primary); }
    .choice.selected { border-color: var(--color-primary); background: var(--color-light); }
    .choice:active { transform: scale(0.98); }

    .btn-primary {
      width: 100%; padding: 16px; background: var(--color-primary); color: white; border: none;
      border-radius: var(--radius-btn); font-family: inherit; font-size: 1.1rem; font-weight: bold;
      cursor: pointer; margin-top: 8px; transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* ---------- Game-Screen ---------- */
    #screen-game { background: var(--color-bg); padding-top: max(14px, env(safe-area-inset-top)); }
    .hud {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 6px 4px 10px;
    }
    .hud .stage { color: var(--color-dark); font-size: 0.9rem; font-weight: bold; justify-self: start; }
    .hud .progress {
      color: var(--color-primary); font-size: 1rem; font-weight: bold; padding: 6px 14px;
      background: white; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .hud .hud-btn {
      width: 44px; height: 44px; border: none; background: white; border-radius: 50%;
      font-size: 1.4rem; font-weight: bold; color: var(--color-primary); cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10); justify-self: end;
      display: flex; align-items: center; justify-content: center;
    }
    .turn-dot { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.18); }
    .turn-dot.p1 { background: var(--p1); }
    .turn-dot.p2 { background: var(--p2); }

    .play-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

    .board-wrap {
      background: var(--color-dark); border-radius: 16px; padding: 10px;
      box-shadow: 0 10px 30px rgba(104,53,29,0.30); width: min(94vw, 420px);
    }
    svg.board { width: 100%; height: auto; display: block; border-radius: 6px; overflow: hidden; }
    .sq-light { fill: var(--sq-light); }
    .sq-dark  { fill: var(--sq-dark); }
    .piece-p1 { fill: var(--p1); stroke: var(--p1-border); stroke-width: 4; }
    .piece-p2 { fill: var(--p2); stroke: var(--p2-border); stroke-width: 4; }
    .piece.fresh { animation: pop 0.28s ease; }
    .king-ring { fill: none; stroke: var(--king); stroke-width: 5; }
    .king-star { fill: var(--king); }
    .sel-ring { fill: none; stroke: #ffffff; stroke-width: 5; }
    .target-ring { fill: var(--color-dark); opacity: 0.55; animation: pulse 1.2s ease-in-out infinite; }
    .capture-hint { fill: none; stroke: #ffd54f; stroke-width: 5; animation: blink 1s ease-in-out infinite; }
    .hit { fill: transparent; cursor: pointer; }

    @keyframes pop { from { transform: scale(0.5); transform-box: fill-box; transform-origin: center; } to { transform: scale(1); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.25; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fade-in 0.25s ease; }

    .hint { font-size: 0.95rem; color: var(--color-dark); text-align: center; min-height: 1.3em; font-weight: bold; }

    /* ---------- End-Screen ---------- */
    #screen-end {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center; align-items: center;
    }
    #screen-end .card {
      background: white; border-radius: var(--radius-card); padding: 32px 28px;
      max-width: 480px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.18); text-align: center;
    }
    #screen-end .end-emblem { font-size: 3rem; margin-bottom: 8px; }
    #screen-end h2 { color: var(--color-primary); font-size: 1.8rem; margin-bottom: 10px; }
    #screen-end p { color: var(--color-dark); margin-bottom: 22px; }
    #screen-end .actions { display: flex; flex-direction: column; gap: 10px; }
    #screen-end .btn-secondary {
      padding: 14px; background: white; color: var(--color-primary); border: 2px solid var(--color-primary);
      border-radius: var(--radius-btn); font-family: inherit; font-size: 1rem; font-weight: bold;
      cursor: pointer; text-decoration: none; display: block;
    }

    button:focus-visible, a:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 380px) { #screen-start h1 { font-size: 1.8rem; } }
  </style>
</head>
<body>

  <!-- ====================== START-SCREEN ====================== -->
  <div id="screen-start" class="screen">
    <div class="card">
      <a href="../" class="back-link" aria-label="Zurück zur Spiele-Übersicht">&larr; Übersicht</a>
      <h1>Dame</h1>
      <p class="sub">Zieht eure Steine schräg vorwärts. Springt über gegnerische Steine, um sie zu schlagen — wer schlagen kann, muss! In der letzten Reihe wird ein Stein zur Dame.</p>

      <div class="group">
        <h2>Wie wollt ihr spielen?</h2>
        <div class="stage-list" role="radiogroup" aria-label="Spielmodus">
          <button class="choice selected" data-mode="zwei" role="radio" aria-checked="true">Zu zweit — Hell gegen Rot</button>
          <button class="choice"          data-mode="computer" role="radio" aria-checked="false">Gegen den Computer — du bist Hell</button>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">Los geht's</button>
    </div>
  </div>

  <!-- ====================== GAME-SCREEN ====================== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="stage" id="hud-stage">Zu zweit</span>
      <span class="progress" id="hud-progress"><span class="turn-dot p1" id="turn-dot"></span><span id="turn-text">Hell ist dran</span></span>
      <button class="hud-btn" id="hud-close" aria-label="Spiel beenden, zurück zum Start">×</button>
    </div>

    <div class="play-area">
      <div class="board-wrap">
        <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-label="Dame-Brett"></svg>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <!-- ====================== END-SCREEN ====================== -->
  <div id="screen-end" class="screen hidden">
    <div class="card">
      <div class="end-emblem" id="end-emblem" aria-hidden="true">🎉</div>
      <h2 id="end-title">Schöne Runde!</h2>
      <p id="end-message"></p>
      <div class="actions">
        <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
        <button class="btn-secondary" id="btn-restage">Anderer Modus</button>
        <a class="btn-secondary" href="../">Zur Übersicht</a>
      </div>
    </div>
  </div>

  <!-- ====================== AUDIO-LIB ====================== -->
  <script src="../_lib/audio.js"></script>

  <!-- ====================== SPIEL-LOGIK ====================== -->
  <script>
    'use strict';

    const GAME_ID = 'dame';
    const PREFS_KEY = GAME_ID + '-prefs';
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const N = 8, SQ = 80;

    // Codes: 0 leer, 1 Hell-Stein, 2 Rot-Stein, 3 Hell-Dame, 4 Rot-Dame
    const state = {
      mode: 'zwei',
      board: [],
      current: 1,
      selected: null,          // [r,c]
      mustContinueFrom: null,  // [r,c] Mehrfachsprung-Zwang
      lastTo: null,
      locked: false,
      running: false
    };

    function ownerOf(code) { return code === 0 ? 0 : (code === 1 || code === 3 ? 1 : 2); }
    function isKing(code) { return code === 3 || code === 4; }
    function other(p) { return p === 1 ? 2 : 1; }
    function inB(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
    function playable(r, c) { return (r + c) % 2 === 1; }

    // --- LocalStorage ---
    function loadPrefs() { try { const raw = localStorage.getItem(PREFS_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; } }
    function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) {} }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.add('hidden'); });
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('fade-in');
      setTimeout(function () { el.classList.remove('fade-in'); }, 300);
    }

    // --- Start-Screen ---
    function initStartScreen() {
      const prefs = loadPrefs();
      if (prefs.mode === 'zwei' || prefs.mode === 'computer') state.mode = prefs.mode;
      const btns = document.querySelectorAll('#screen-start .choice');
      btns.forEach(function (btn) {
        const isSel = btn.dataset.mode === state.mode;
        btn.classList.toggle('selected', isSel);
        btn.setAttribute('aria-checked', String(isSel));
        btn.addEventListener('click', function () {
          state.mode = btn.dataset.mode;
          btns.forEach(function (b) {
            b.classList.toggle('selected', b === btn);
            b.setAttribute('aria-checked', String(b === btn));
          });
          savePrefs({ mode: state.mode });
        });
      });
      document.getElementById('btn-start').addEventListener('click', startGame);
    }

    // --- Spiel starten ---
    function startGame() {
      state.board = [];
      for (let r = 0; r < N; r++) state.board.push(new Array(N).fill(0));
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (!playable(r, c)) continue;
        if (r <= 2) state.board[r][c] = 2;       // Rot oben
        else if (r >= 5) state.board[r][c] = 1;  // Hell unten
      }
      state.current = 1;
      state.selected = null;
      state.mustContinueFrom = null;
      state.lastTo = null;
      state.locked = false;
      state.running = true;
      document.getElementById('hud-stage').textContent = state.mode === 'computer' ? 'Gegen Computer' : 'Zu zweit';
      render();
      updateHud();
      showScreen('screen-game');
    }

    // --- Zug-Erzeugung ---
    function pieceSteps(r, c) {
      const code = state.board[r][c];
      const player = ownerOf(code);
      const dirs = isKing(code)
        ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
        : (player === 1 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]);
      const caps = [], simples = [];
      dirs.forEach(function (d) {
        const dr = d[0], dc = d[1];
        const nr = r + dr, nc = c + dc;
        if (inB(nr, nc) && state.board[nr][nc] === 0) simples.push({ to: [nr, nc], cap: null });
        const lr = r + 2 * dr, lc = c + 2 * dc;
        if (inB(lr, lc) && state.board[lr][lc] === 0 && inB(nr, nc)
            && state.board[nr][nc] !== 0 && ownerOf(state.board[nr][nc]) !== player) {
          caps.push({ to: [lr, lc], cap: [nr, nc] });
        }
      });
      return { caps: caps, simples: simples };
    }

    function playerHasCapture(player) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
        if (ownerOf(state.board[r][c]) === player && pieceSteps(r, c).caps.length) return true;
      return false;
    }
    function hasAnyLegalMove(player) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (ownerOf(state.board[r][c]) !== player) continue;
        const s = pieceSteps(r, c);
        if (s.caps.length || s.simples.length) return true;
      }
      return false;
    }
    function countPieces(player) {
      let n = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (ownerOf(state.board[r][c]) === player) n++;
      return n;
    }

    // Legale Ziele des gewählten Steins unter Schlagzwang
    function legalTargets(r, c) {
      const s = pieceSteps(r, c);
      if (state.mustContinueFrom) return s.caps;
      if (playerHasCapture(state.current)) return s.caps;
      return s.simples;
    }
    function isSelectable(r, c) {
      if (ownerOf(state.board[r][c]) !== state.current) return false;
      if (state.mustContinueFrom) return state.mustContinueFrom[0] === r && state.mustContinueFrom[1] === c;
      return legalTargets(r, c).length > 0;
    }

    // --- Rendering ---
    function render() {
      const svg = document.getElementById('board');
      svg.innerHTML = '';

      // Felder
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        svg.appendChild(mk('rect', { x: c * SQ, y: r * SQ, width: SQ, height: SQ, class: playable(r, c) ? 'sq-dark' : 'sq-light' }));
      }

      // Ziel-Markierungen des gewählten Steins
      let targets = [];
      if (state.selected) targets = legalTargets(state.selected[0], state.selected[1]);
      targets.forEach(function (t) {
        svg.appendChild(mk('circle', { cx: t.to[1] * SQ + SQ / 2, cy: t.to[0] * SQ + SQ / 2, r: 16, class: 'target-ring' }));
      });

      // Schlagzwang-Hinweis: schlagbare eigene Steine markieren
      const showCaptureHint = !state.selected && !state.mustContinueFrom && playerHasCapture(state.current)
        && !(state.mode === 'computer' && state.current === 2);

      // Steine
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const code = state.board[r][c];
        if (!code) continue;
        const cx = c * SQ + SQ / 2, cy = r * SQ + SQ / 2;
        const fresh = state.lastTo && state.lastTo[0] === r && state.lastTo[1] === c ? ' fresh' : '';
        svg.appendChild(mk('circle', { cx: cx, cy: cy, r: 30, class: 'piece piece-p' + ownerOf(code) + fresh }));
        if (isKing(code)) {
          svg.appendChild(mk('circle', { cx: cx, cy: cy, r: 20, class: 'king-ring' }));
          svg.appendChild(star(cx, cy, 11, 5));
        }
        if (state.selected && state.selected[0] === r && state.selected[1] === c)
          svg.appendChild(mk('circle', { cx: cx, cy: cy, r: 36, class: 'sel-ring' }));
        if (showCaptureHint && ownerOf(code) === state.current && pieceSteps(r, c).caps.length)
          svg.appendChild(mk('circle', { cx: cx, cy: cy, r: 36, class: 'capture-hint' }));
      }

      // Klickflächen (nur spielbare Felder)
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (!playable(r, c)) continue;
        const hit = mk('rect', { x: c * SQ, y: r * SQ, width: SQ, height: SQ, class: 'hit', 'data-r': r, 'data-c': c });
        hit.setAttribute('aria-label', 'Feld ' + (r + 1) + '-' + (c + 1));
        svg.appendChild(hit);
      }
    }

    function mk(tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }
    function star(cx, cy, rOut, points) {
      const rIn = rOut * 0.45;
      let d = '';
      for (let i = 0; i < points * 2; i++) {
        const rad = (i % 2 === 0) ? rOut : rIn;
        const ang = (Math.PI / points) * i - Math.PI / 2;
        const x = cx + rad * Math.cos(ang), y = cy + rad * Math.sin(ang);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      d += 'Z';
      return mk('path', { d: d, class: 'king-star' });
    }

    function updateHud() {
      const dot = document.getElementById('turn-dot');
      const txt = document.getElementById('turn-text');
      dot.className = 'turn-dot ' + (state.current === 1 ? 'p1' : 'p2');
      const name = state.current === 1 ? 'Hell' : 'Rot';
      if (state.mode === 'computer' && state.current === 2) txt.textContent = 'Computer denkt …';
      else txt.textContent = name + ' ist dran';
      setHint();
    }
    function setHint() {
      const el = document.getElementById('hint');
      if (state.mode === 'computer' && state.current === 2) { el.textContent = 'Der Computer ist am Zug …'; return; }
      if (state.mustContinueFrom) { el.textContent = 'Weiter springen!'; return; }
      if (playerHasCapture(state.current)) { el.textContent = state.selected ? 'Spring über den gegnerischen Stein.' : 'Du kannst schlagen — wähle einen leuchtenden Stein.'; return; }
      el.textContent = state.selected ? 'Zieh ihn schräg vorwärts.' : 'Wähle einen deiner Steine.';
    }

    function sound(name) {
      if (!(window.Lernspiele && Lernspiele.Audio)) return;
      if (name === 'move') Lernspiele.Audio.tap();
      else if (name === 'capture') Lernspiele.Audio.tone(300, 0.12, 0.06, 'triangle');
      else if (name === 'king') Lernspiele.Audio.correct();
      else if (name === 'end') Lernspiele.Audio.correct();
    }

    // --- Zug ausführen (ein Schritt) ---
    function doStep(fr, fc, tr, tc, cap) {
      const code = state.board[fr][fc];
      state.board[fr][fc] = 0;
      if (cap) state.board[cap[0]][cap[1]] = 0;
      state.board[tr][tc] = code;

      let promoted = false;
      if (!isKing(code)) {
        if (ownerOf(code) === 1 && tr === 0) { state.board[tr][tc] = 3; promoted = true; }
        else if (ownerOf(code) === 2 && tr === 7) { state.board[tr][tc] = 4; promoted = true; }
      }
      state.lastTo = [tr, tc];
      sound(promoted ? 'king' : (cap ? 'capture' : 'move'));
      render();

      if (cap && !promoted && pieceSteps(tr, tc).caps.length) {
        state.mustContinueFrom = [tr, tc];
        state.selected = [tr, tc];
        render();
        updateHud();
        if (state.mode === 'computer' && state.current === 2) { state.locked = true; setTimeout(aiStep, 550); }
        else state.locked = false;
        return;
      }
      endTurn();
    }

    function endTurn() {
      state.selected = null;
      state.mustContinueFrom = null;
      state.current = other(state.current);

      if (countPieces(state.current) === 0 || !hasAnyLegalMove(state.current)) {
        finishGame(other(state.current));
        return;
      }
      render();
      updateHud();
      if (state.mode === 'computer' && state.current === 2) { state.locked = true; setTimeout(aiTurn, 650); }
      else state.locked = false;
    }

    // --- Eingabe (Mensch) ---
    document.getElementById('board').addEventListener('click', function (e) {
      if (!state.running || state.locked) return;
      if (state.mode === 'computer' && state.current === 2) return;
      const hit = e.target.closest('[data-r]');
      if (!hit) return;
      const r = Number(hit.dataset.r), c = Number(hit.dataset.c);

      // Ziel eines gewählten Steins?
      if (state.selected) {
        const t = legalTargets(state.selected[0], state.selected[1]).find(function (x) { return x.to[0] === r && x.to[1] === c; });
        if (t) { doStep(state.selected[0], state.selected[1], r, c, t.cap); return; }
      }
      // Stein (neu) wählen?
      if (isSelectable(r, c)) {
        state.selected = (state.selected && state.selected[0] === r && state.selected[1] === c) ? null : [r, c];
        render();
        setHint();
      }
    });

    // --- KI (Spieler 2) ---
    function collectSteps(player) {
      const capSteps = [], simpleSteps = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (ownerOf(state.board[r][c]) !== player) continue;
        const s = pieceSteps(r, c);
        s.caps.forEach(function (x) { capSteps.push({ from: [r, c], to: x.to, cap: x.cap }); });
        s.simples.forEach(function (x) { simpleSteps.push({ from: [r, c], to: x.to, cap: null }); });
      }
      return capSteps.length ? capSteps : simpleSteps;
    }

    function aiTurn() {
      if (!state.running || state.current !== 2) return;
      const steps = collectSteps(2);
      if (!steps.length) { finishGame(1); return; }
      const st = aiChoose(steps);
      doStep(st.from[0], st.from[1], st.to[0], st.to[1], st.cap);
    }
    function aiStep() {
      if (!state.running || !state.mustContinueFrom) return;
      const r = state.mustContinueFrom[0], c = state.mustContinueFrom[1];
      const caps = pieceSteps(r, c).caps;
      if (!caps.length) { endTurn(); return; }
      const st = pickCapture(caps.map(function (x) { return { from: [r, c], to: x.to, cap: x.cap }; }));
      doStep(r, c, st.to[0], st.to[1], st.cap);
    }

    function aiChoose(steps) {
      if (steps[0].cap) return pickCapture(steps);
      // einfache Züge bewerten
      let best = [], bestScore = -Infinity;
      steps.forEach(function (st) {
        const s = scoreSimple(st);
        if (s > bestScore) { bestScore = s; best = [st]; }
        else if (s === bestScore) best.push(st);
      });
      return pick(best);
    }
    function pickCapture(steps) {
      let best = [], bestScore = -Infinity;
      steps.forEach(function (st) {
        let s = 0;
        const capCode = state.board[st.cap[0]][st.cap[1]];
        if (isKing(capCode)) s += 3;                       // Dame schlagen ist wertvoll
        const mover = state.board[st.from[0]][st.from[1]];
        if (!isKing(mover) && st.to[0] === 7) s += 2;      // Umwandlung
        s += Math.random();
        if (s > bestScore) { bestScore = s; best = [st]; }
        else if (s === bestScore) best.push(st);
      });
      return pick(best);
    }
    function scoreSimple(st) {
      const fr = st.from[0], fc = st.from[1], tr = st.to[0], tc = st.to[1];
      const code = state.board[fr][fc];
      state.board[fr][fc] = 0;
      let placed = code;
      if (!isKing(code) && ownerOf(code) === 2 && tr === 7) placed = 4;
      const prevTo = state.board[tr][tc];
      state.board[tr][tc] = placed;

      let s = tr * 0.5;                     // Vorrücken Richtung Umwandlung
      if (placed === 4) s += 4;             // wird Dame
      if (opponentCanCapture(tr, tc, 1)) s -= 8;  // hängt sich nicht rein
      // hält lieber Kontakt zur eigenen Grundreihe (Rand ist sicherer)
      if (tc === 0 || tc === 7) s += 0.3;

      state.board[tr][tc] = prevTo;
      state.board[fr][fc] = code;
      return s + Math.random() * 0.4;
    }
    function opponentCanCapture(tr, tc, opp) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (ownerOf(state.board[r][c]) !== opp) continue;
        const caps = pieceSteps(r, c).caps;
        for (const x of caps) if (x.cap[0] === tr && x.cap[1] === tc) return true;
      }
      return false;
    }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // --- Spielende ---
    function finishGame(winner) {
      state.running = false;
      state.locked = true;
      state.selected = null;
      state.mustContinueFrom = null;
      render();
      const emblem = document.getElementById('end-emblem');
      const title = document.getElementById('end-title');
      const msg = document.getElementById('end-message');
      emblem.textContent = '🎉';
      if (state.mode === 'computer') {
        title.textContent = winner === 1 ? 'Du hast gewonnen!' : 'Der Computer gewinnt';
        msg.textContent = winner === 1 ? 'Toll gespielt — magst du nochmal?' : 'Diesmal war der Computer geschickter. Magst du nochmal probieren?';
      } else {
        title.textContent = (winner === 1 ? 'Hell' : 'Rot') + ' gewinnt!';
        msg.textContent = 'Schön gespielt, ihr zwei. Magst du nochmal?';
      }
      sound('end');
      setTimeout(function () { showScreen('screen-end'); }, 500);
    }

    // --- Buttons ---
    document.getElementById('hud-close').addEventListener('click', function () { state.running = false; showScreen('screen-start'); });
    document.getElementById('btn-replay').addEventListener('click', startGame);
    document.getElementById('btn-restage').addEventListener('click', function () { showScreen('screen-start'); });

    document.addEventListener('pointerdown', function () {
      if (window.Lernspiele && Lernspiele.Audio) Lernspiele.Audio.ensure();
    }, { once: true });

    initStartScreen();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
