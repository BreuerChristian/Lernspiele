<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#c2185b"/>
  <!-- Reihe von 3 Symbolen + Fragezeichen -->
  <!-- Kreis -->
  <circle cx="120" cy="256" r="52" fill="#ffd54f" stroke="#7a3a1a" stroke-width="6"/>
  <!-- Quadrat -->
  <rect x="204" y="204" width="104" height="104" rx="14" fill="#4fc3f7" stroke="#0d3d5a" stroke-width="6"/>
  <!-- Dreieck -->
  <polygon points="392,308 444,212 340,212" fill="#aed581" stroke="#2e5a1a" stroke-width="6"/>
  <!-- Fragezeichen-Feld -->
  <rect x="68" y="356" width="376" height="100" rx="22" fill="white" stroke="#c2185b" stroke-width="6" stroke-dasharray="10 8"/>
  <text x="256" y="406" text-anchor="middle" dominant-baseline="central"
        font-family="Verdana, Tahoma, sans-serif" font-size="68" font-weight="bold" fill="#c2185b">?</text>
</svg>
