<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vollflaechiger Hintergrund (kein border-radius - wird vom OS maskiert) -->
  <rect width="512" height="512" fill="#c2185b"/>
  <!-- Inhalt innerhalb 80% Safe-Zone (256 +/- 205, also 51..461) -->
  <!-- Reihe von 3 Symbolen, etwas hoeher und kleiner -->
  <circle cx="146" cy="246" r="42" fill="#ffd54f" stroke="#7a3a1a" stroke-width="5"/>
  <rect x="214" y="204" width="84" height="84" rx="12" fill="#4fc3f7" stroke="#0d3d5a" stroke-width="5"/>
  <polygon points="366,288 408,206 324,206" fill="#aed581" stroke="#2e5a1a" stroke-width="5"/>
  <!-- Fragezeichen-Feld unter den Symbolen -->
  <rect x="116" y="320" width="280" height="86" rx="18" fill="white" stroke="#fde7ef" stroke-width="5" stroke-dasharray="9 7"/>
  <text x="256" y="364" text-anchor="middle" dominant-baseline="central"
        font-family="Verdana, Tahoma, sans-serif" font-size="58" font-weight="bold" fill="#c2185b">?</text>
</svg>
