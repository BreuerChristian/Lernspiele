  <circle cx="332" cy="180" r="44" fill="#ffd166"/>
  <circle cx="256" cy="256" r="44" fill="#a0e7a0"/>
  <circle cx="180" cy="332" r="44" fill="#b6c4ff"/>
  <circle cx="332" cy="332" r="44" fill="#e0a3ff"/>
</svg>
