<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#d97706"/>
  <!-- Drei Schrauben mit gestapelten Muttern -->
  <g>
    <!-- Schraube 1: fertig sortiert (rot) -->
    <rect x="112" y="96" width="28" height="300" rx="12" fill="#9aa2ab"/>
    <rect x="100" y="80" width="52" height="26" rx="10" fill="#7b838c"/>
    <rect x="72" y="384" width="108" height="20" rx="10" fill="#b9946b"/>
    <g fill="#e05353" stroke="#00000030" stroke-width="4" stroke-linejoin="round">
      <polygon points="86,318 106,296 146,296 166,318 146,340 106,340"/>
      <polygon points="86,262 106,240 146,240 166,262 146,284 106,284"/>
      <polygon points="86,206 106,184 146,184 166,206 146,228 106,228"/>
    </g>
    <!-- Schraube 2: gemischt -->
    <rect x="242" y="60" width="28" height="336" rx="12" fill="#9aa2ab"/>
    <rect x="230" y="44" width="52" height="26" rx="10" fill="#7b838c"/>
    <rect x="202" y="384" width="108" height="20" rx="10" fill="#b9946b"/>
    <g stroke="#00000030" stroke-width="4" stroke-linejoin="round">
      <polygon fill="#4a90d9" points="216,318 236,296 276,296 296,318 276,340 236,340"/>
      <polygon fill="#f2c94c" points="216,262 236,240 276,240 296,262 276,284 236,284"/>
      <polygon fill="#4a90d9" points="216,206 236,184 276,184 296,206 276,228 236,228"/>
    </g>
    <!-- Schraube 3: eine Mutter schwebt gerade drauf -->
    <rect x="372" y="96" width="28" height="300" rx="12" fill="#9aa2ab"/>
    <rect x="360" y="80" width="52" height="26" rx="10" fill="#7b838c"/>
    <rect x="332" y="384" width="108" height="20" rx="10" fill="#b9946b"/>
    <g stroke="#00000030" stroke-width="4" stroke-linejoin="round">
      <polygon fill="#f2c94c" points="346,318 366,296 406,296 426,318 406,340 366,340"/>
      <polygon fill="#f2c94c" points="346,210 366,188 406,188 426,210 406,232 366,232"/>
    </g>
  </g>
  <!-- Loecher in den Muttern -->
  <g fill="#d97706" opacity="0.55">
    <circle cx="126" cy="318" r="11"/><circle cx="126" cy="262" r="11"/><circle cx="126" cy="206" r="11"/>
    <circle cx="256" cy="318" r="11"/><circle cx="256" cy="262" r="11"/><circle cx="256" cy="206" r="11"/>
    <circle cx="386" cy="318" r="11"/><circle cx="386" cy="210" r="11"/>
  </g>
</svg>
