<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Tic-Tac-Toe</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#2a9d8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --color-primary: #2a9d8f;
      --color-light:   #a9d7d2;
      --color-dark:    #1b665c;
      --color-bg:      #e5f3f1;
      --color-success: #2e7d32;
      --color-error:   #c62828;
      --radius-card:   28px;
      --radius-btn:    16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Verdana', 'Tahoma', sans-serif;
      background: var(--color-bg);
      color: #2a2a2a;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ---------- Screens ---------- */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .screen.hidden { display: none; }

    /* ---------- Start-Screen ---------- */
    #screen-start {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center;
      align-items: center;
      padding-top: 20px;
      overflow-y: auto;
    }
    #screen-start .card {
      background: white;
      border-radius: var(--radius-card);
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      text-align: center;
    }
    #screen-start h1 {
      color: var(--color-primary);
      font-size: 2.2rem;
      margin-bottom: 6px;
    }
    #screen-start .sub {
      color: var(--color-dark);
      margin-bottom: 22px;
      font-size: 1rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 14px;
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--color-light);
      transition: background 0.15s;
    }
    .back-link:hover, .back-link:focus { background: var(--color-bg); }

    .group { margin-bottom: 22px; text-align: left; }
    .group h2 {
      color: var(--color-primary);
      font-size: 1.05rem;
      margin-bottom: 10px;
      font-weight: bold;
      text-align: center;
    }
    .stage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice {
      background: var(--color-bg);
      border: 3px solid transparent;
      border-radius: var(--radius-btn);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--color-dark);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, transform 0.1s;
    }
    .choice:hover, .choice:focus {
      border-color: var(--color-primary);
    }
    .choice.selected {
      border-color: var(--color-primary);
      background: var(--color-light);
    }
    .choice:active { transform: scale(0.98); }
    .choice small {
      display: block;
      font-weight: normal;
      font-size: 0.82rem;
      margin-top: 2px;
      color: var(--color-dark);
      opacity: 0.8;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---------- Game-Screen ---------- */
    #screen-game {
      background: var(--color-bg);
      padding-top: max(14px, env(safe-area-inset-top));
    }

    /* HUD: links Stufe | Mitte Zug-Anzeige | rechts Schliessen */
    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 6px 4px 14px;
    }
    .hud .stage {
      color: var(--color-dark);
      font-size: 0.9rem;
      font-weight: bold;
      justify-self: start;
    }
    .hud .progress {
      color: var(--color-primary);
      font-size: 1rem;
      font-weight: bold;
      padding: 6px 14px;
      background: white;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .hud .hud-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: white;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--color-primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 0;
    }

    /* Zug-Anzeige ueber dem Brett: Icon + Text */
    .turn {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--color-dark);
      min-height: 44px;
    }
    .turn .turn-icon {
      width: 40px;
      height: 40px;
      display: flex;
    }
    .turn .turn-icon svg { width: 100%; height: 100%; }

    /* ---------- Brett ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: min(86vw, 56vh, 420px);
      background: var(--color-light);
      padding: 10px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .cell {
      aspect-ratio: 1;
      background: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      padding: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      transition: transform 0.1s;
    }
    .cell:active { transform: scale(0.96); }
    .cell svg {
      width: 100%;
      height: 100%;
      animation: pop-in 0.2s ease;
    }
    .cell.win {
      background: var(--color-light);
      animation: correct-pulse 0.7s ease 2;
    }
    .cell.blocked { animation: wrong-wiggle 0.45s ease; }

    @keyframes pop-in {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* ---------- End-Screen ---------- */
    #screen-end {
      background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-light) 100%);
      justify-content: center;
      align-items: center;
    }
    #screen-end .card {
      background: white;
      border-radius: var(--radius-card);
      padding: 32px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      text-align: center;
    }
    #screen-end .end-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    #screen-end .end-icon svg { width: 100%; height: 100%; min-width: 0; }
    #screen-end h2 {
      color: var(--color-primary);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    #screen-end p {
      color: var(--color-dark);
      margin-bottom: 22px;
    }
    #screen-end .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #screen-end .btn-secondary {
      padding: 14px;
      background: white;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    /* ---------- Standard-Animationen ---------- */
    @keyframes correct-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }
    @keyframes wrong-wiggle {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fade-in 0.25s ease; }

    /* ---------- Accessibility ---------- */
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 380px) {
      #screen-start h1 { font-size: 1.8rem; }
      .turn { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- ====================== START-SCREEN ====================== -->
  <div id="screen-start" class="screen">
    <div class="card">
      <a href="../" class="back-link" aria-label="Zurueck zur Spiele-Uebersicht">&larr; Übersicht</a>
      <h1>Tic-Tac-Toe</h1>
      <p class="sub">Drei in einer Reihe — Katze gegen Hund</p>

      <div class="group">
        <h2>Wie wollt ihr spielen?</h2>
        <div class="stage-list" role="radiogroup" aria-label="Spielmodus">
          <button class="choice selected" data-mode="zwei" role="radio" aria-checked="true">
            Zu zweit
            <small>Abwechselnd tippen — Katze gegen Hund</small>
          </button>
          <button class="choice" data-mode="computer" role="radio" aria-checked="false">
            Gegen den Computer
            <small>Du bist die Katze, der Computer der Hund</small>
          </button>
        </div>
      </div>

      <div class="group" id="group-level" hidden>
        <h2>Wie aufmerksam ist der Computer-Hund?</h2>
        <div class="stage-list" role="radiogroup" aria-label="Schwierigkeitsstufe">
          <button class="choice selected" data-level="leicht" role="radio" aria-checked="true">
            Leicht
            <small>Der Hund tippt einfach irgendwo hin</small>
          </button>
          <button class="choice" data-level="mittel" role="radio" aria-checked="false">
            Mittel
            <small>Der Hund passt ein bisschen auf</small>
          </button>
          <button class="choice" data-level="schwer" role="radio" aria-checked="false">
            Schwer
            <small>Der Hund passt sehr gut auf</small>
          </button>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">Los geht's</button>
    </div>
  </div>

  <!-- ====================== GAME-SCREEN ====================== -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span class="stage" id="hud-stage">Zu zweit</span>
      <span class="progress" id="hud-progress">Katze ist dran</span>
      <button class="hud-btn" id="hud-close" aria-label="Spiel beenden, zurueck zum Start">×</button>
    </div>

    <div class="play-area">
      <div class="turn" aria-live="polite">
        <span class="turn-icon" id="turn-icon" aria-hidden="true"></span>
        <span id="turn-text">Katze ist dran</span>
      </div>
      <div class="board" id="board" role="grid" aria-label="Spielbrett 3 mal 3"></div>
    </div>
  </div>

  <!-- ====================== END-SCREEN ====================== -->
  <div id="screen-end" class="screen hidden">
    <div class="card">
      <div class="end-icon" id="end-icon" aria-hidden="true"></div>
      <h2 id="end-title">Drei in einer Reihe!</h2>
      <p id="end-message"></p>
      <div class="actions">
        <button class="btn-primary" id="btn-replay">Nochmal spielen</button>
        <button class="btn-secondary" id="btn-restage">Andere Stufe</button>
        <a class="btn-secondary" href="../">Zur Übersicht</a>
      </div>
    </div>
  </div>

  <!-- ====================== AUDIO-LIB ====================== -->
  <script src="../_lib/audio.js"></script>

  <!-- ====================== SPIEL-LOGIK ====================== -->

      // ICON:hund END
    };

    const PLAYERS = {
      katze: { label: 'Katze', artikel: 'Die Katze' },
      hund:  { label: 'Hund',  artikel: 'Der Hund' }
    };
    const LEVELS = { leicht: 'Leicht', mittel: 'Mittel', schwer: 'Schwer' };
    const LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    // Etwas hoeherer Ton fuer die Katze, tieferer fuer den Hund
    const PLACE_TONE = { katze: 520, hund: 340 };

    const state = {
      mode: 'zwei',        // 'zwei' | 'computer'
      level: 'leicht',
      board: [],           // 9 Felder: null | 'katze' | 'hund'
      turn: 'katze',
      firstTurn: 'katze',  // wechselt im Zu-zweit-Modus pro Runde
      over: false,
      locked: false,       // true waehrend der Computer "ueberlegt"
      thinkTimer: null,
      endTimer: null
    };

    // --- LocalStorage ---
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function savePrefs(prefs) {
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }
      catch (e) { /* quota exceeded etc. */ }
    }

    // --- Screen-Wechsel ---
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.add('hidden'); });
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('fade-in');
      setTimeout(function () { el.classList.remove('fade-in'); }, 300);
    }

    function clearTimers() {
      if (state.thinkTimer) { clearTimeout(state.thinkTimer); state.thinkTimer = null; }
      if (state.endTimer)   { clearTimeout(state.endTimer);   state.endTimer = null; }
    }

    // --- Start-Screen ---
    function syncChoices(selector, dataKey, current) {
      document.querySelectorAll(selector).forEach(function (btn) {
        const active = btn.dataset[dataKey] === current;
        btn.classList.toggle('selected', active);
        btn.setAttribute('aria-checked', String(active));
      });
    }

    function initStartScreen() {
      const prefs = loadPrefs();
      if (prefs.mode === 'zwei' || prefs.mode === 'computer') state.mode = prefs.mode;
      if (prefs.level && LEVELS[prefs.level]) state.level = prefs.level;

      syncChoices('[data-mode]', 'mode', state.mode);
      syncChoices('[data-level]', 'level', state.level);
      document.getElementById('group-level').hidden = (state.mode !== 'computer');

      document.querySelectorAll('[data-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.mode = btn.dataset.mode;
          syncChoices('[data-mode]', 'mode', state.mode);
          document.getElementById('group-level').hidden = (state.mode !== 'computer');
          savePrefs({ mode: state.mode, level: state.level });
        });
      });
      document.querySelectorAll('[data-level]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.level = btn.dataset.level;
          syncChoices('[data-level]', 'level', state.level);
          savePrefs({ mode: state.mode, level: state.level });
        });
      });

      document.getElementById('btn-start').addEventListener('click', function () {
        state.firstTurn = 'katze';
        startGame();
      });
    }

    // --- Game-Screen ---
    function startGame() {
      clearTimers();
      state.board = [null, null, null, null, null, null, null, null, null];
      state.over = false;
      state.locked = false;
      // Im Computer-Modus beginnt immer das Kind (die Katze).
      state.turn = (state.mode === 'computer') ? 'katze' : state.firstTurn;

      document.getElementById('hud-stage').textContent =
        (state.mode === 'computer') ? 'Computer · ' + LEVELS[state.level] : 'Zu zweit';

      renderBoard();
      updateTurnUI();
      showScreen('screen-game');
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.dataset.idx = String(i);
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', cellLabel(i));
        cell.addEventListener('click', function () { onCellTap(i); });
        boardEl.appendChild(cell);
      }
    }

    function cellLabel(i) {
      const pos = 'Feld ' + (Math.floor(i / 3) + 1) + ',' + ((i % 3) + 1);
      const p = state.board[i];
      return pos + ': ' + (p ? PLAYERS[p].label : 'frei');
    }

    function updateTurnUI() {
      const p = state.turn;
      let text;
      if (state.mode === 'computer') {
        text = (p === 'katze') ? 'Du bist dran' : 'Der Hund überlegt …';
      } else {
        text = PLAYERS[p].label + ' ist dran';
      }
      document.getElementById('turn-text').textContent = text;
      document.getElementById('hud-progress').textContent = text;
      document.getElementById('turn-icon').innerHTML = ICONS[p];
    }

    function onCellTap(i) {
      if (state.over || state.locked) return;
      if (state.board[i]) {
        // Feld schon belegt: kurz wackeln, kein Straf-Sound
        const cell = boardCell(i);
        cell.classList.remove('blocked');
        void cell.offsetWidth; // Animation neu starten
        cell.classList.add('blocked');
        return;
      }
      place(i);
    }

    function boardCell(i) {
      return document.getElementById('board').children[i];
    }

    function place(i) {
      if (state.over || state.board[i]) return;
      const p = state.turn;
      state.board[i] = p;
      const cell = boardCell(i);
      cell.innerHTML = ICONS[p];
      cell.setAttribute('aria-label', cellLabel(i));
      Lernspiele.Audio.tone(PLACE_TONE[p], 0.08, 0.05);

      const winLine = findWinLine(state.board, p);
      if (winLine) { finishWin(p, winLine); return; }
      if (state.board.every(Boolean)) { finishDraw(); return; }

      state.turn = (p === 'katze') ? 'hund' : 'katze';
      updateTurnUI();

      if (state.mode === 'computer' && state.turn === 'hund') {
        state.locked = true;
        state.thinkTimer = setTimeout(function () {
          state.thinkTimer = null;
          if (state.over) return;
          const move = computerMove();
          state.locked = false;
          place(move);
        }, 650 + Math.random() * 500);
      }
    }

    // --- Spielende ---
    function finishWin(p, line) {
      state.over = true;
      line.forEach(function (i) { boardCell(i).classList.add('win'); });
      Lernspiele.Audio.correct();

      let title, msg;
      if (state.mode === 'computer') {
        if (p === 'katze') {
          title = 'Drei in einer Reihe!';
          msg = 'Deine Katze hat eine ganze Reihe voll. Magst du gleich nochmal?';
        } else {
          title = 'Der Hund hat eine Reihe voll';
          msg = 'Diesmal war der Hund schneller mit drei in einer Reihe. Magst du nochmal probieren?';
        }
      } else {
        title = 'Drei in einer Reihe!';
        msg = PLAYERS[p].artikel + ' hat eine ganze Reihe voll. Wollt ihr gleich nochmal?';
      }
      showEnd(title, msg, ICONS[p]);
    }

    function finishDraw() {
      state.over = true;
      Lernspiele.Audio.sequence([
        { freq: 440, dur: 0.12, vol: 0.05 },
        { freq: 520, dur: 0.16, vol: 0.05, delay: 0.12 }
      ]);
      const msg = (state.mode === 'computer')
        ? 'Das Brett ist voll und niemand hat eine Reihe — gut aufgepasst! Magst du nochmal?'
        : 'Das Brett ist voll und niemand hat eine Reihe — gut gespielt, ihr beiden!';
      showEnd('Unentschieden!', msg, null);
    }

    function showEnd(title, msg, iconSvg) {
      document.getElementById('end-title').textContent = title;
      document.getElementById('end-message').textContent = msg;
      const iconEl = document.getElementById('end-icon');
      iconEl.innerHTML = iconSvg || (ICONS.katze + ICONS.hund);
      // Kurz warten, damit die Gewinn-Reihe sichtbar bleibt
      state.endTimer = setTimeout(function () {
        state.endTimer = null;
        showScreen('screen-end');
      }, 1500);
    }

    // --- Computer-Zuege ---
    function freeCells(board) {
      const out = [];
      for (let i = 0; i < 9; i++) if (!board[i]) out.push(i);
      return out;
    }

    function findWinLine(board, p) {
      for (const line of LINES) {
        if (line.every(function (i) { return board[i] === p; })) return line;
      }
      return null;
    }

    // Feld, das fuer p sofort die Reihe voll macht (oder null)
    function findWinningMove(board, p) {
      for (const line of LINES) {
        const vals = line.map(function (i) { return board[i]; });
        if (vals.filter(function (v) { return v === p; }).length === 2) {
          const emptyIdx = line[vals.indexOf(null)];
          if (vals.indexOf(null) !== -1) return emptyIdx;
        }
      }
      return null;
    }

    function randomMove(board) {
      const free = freeCells(board);
      return free[Math.floor(Math.random() * free.length)];
    }

    function computerMove() {
      const board = state.board;
      if (state.level === 'leicht') {
        return randomMove(board);
      }
      if (state.level === 'mittel') {
        const win = findWinningMove(board, 'hund');
        if (win !== null) return win;
        const block = findWinningMove(board, 'katze');
        if (block !== null) return block;
        return randomMove(board);
      }
      return minimaxMove(board);
    }

    // Schwer: Minimax — der Hund spielt fehlerfrei, Unentschieden ist erreichbar
    function minimaxMove(board) {
      let bestScore = -Infinity;
      let best = [];
      for (const i of freeCells(board)) {
        board[i] = 'hund';
        const score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) { bestScore = score; best = [i]; }
        else if (score === bestScore) { best.push(i); }
      }
      return best[Math.floor(Math.random() * best.length)];
    }

    function minimax(board, depth, isHund) {
      if (findWinLine(board, 'hund'))  return 10 - depth;
      if (findWinLine(board, 'katze')) return depth - 10;
      const free = freeCells(board);
      if (!free.length) return 0;

      let best = isHund ? -Infinity : Infinity;
      for (const i of free) {
        board[i] = isHund ? 'hund' : 'katze';
        const score = minimax(board, depth + 1, !isHund);
        board[i] = null;
        best = isHund ? Math.max(best, score) : Math.min(best, score);
      }
      return best;
    }

    // --- End-Screen-Buttons ---
    document.getElementById('btn-replay').addEventListener('click', function () {
      // Zu zweit: die andere Figur darf anfangen
      if (state.mode === 'zwei') {
        state.firstTurn = (state.firstTurn === 'katze') ? 'hund' : 'katze';
      }
      startGame();
    });
    document.getElementById('btn-restage').addEventListener('click', function () {
      clearTimers();
      showScreen('screen-start');
    });

    // --- HUD ---
    document.getElementById('hud-close').addEventListener('click', function () {
      clearTimers();
      state.over = true;
      showScreen('screen-start');
    });

    // --- Audio einmal beim ersten Tap warmlaufen lassen (iOS-Anforderung) ---
    document.addEventListener('pointerdown', function () {
      if (window.Lernspiele && Lernspiele.Audio) Lernspiele.Audio.ensure();
    }, { once: true });

    // --- Init ---
    initStartScreen();

    // --- Service Worker ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
