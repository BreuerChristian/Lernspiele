<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#f3eef9"/>

  <!-- Drei überlappende Tropfen, Spitzen zur Mitte -->
  <!-- Rot: oben -->
  <g transform="translate(256 220) rotate(180)">
    <path d="M0 -120 C -60 -10, -90 70, -50 110 C -20 140, 20 140, 50 110 C 90 70, 60 -10, 0 -120 Z"
          fill="#e53935" stroke="#7a1414" stroke-width="6" opacity="0.92"/>
  </g>
  <!-- Gelb: unten links -->
  <g transform="translate(196 326) rotate(60)">
    <path d="M0 -120 C -60 -10, -90 70, -50 110 C -20 140, 20 140, 50 110 C 90 70, 60 -10, 0 -120 Z"
          fill="#fdd835" stroke="#8c7307" stroke-width="6" opacity="0.92"/>
  </g>
  <!-- Blau: unten rechts -->
  <g transform="translate(316 326) rotate(-60)">
    <path d="M0 -120 C -60 -10, -90 70, -50 110 C -20 140, 20 140, 50 110 C 90 70, 60 -10, 0 -120 Z"
          fill="#1e88e5" stroke="#0a2a55" stroke-width="6" opacity="0.92"/>
  </g>

  <!-- Mitte: Mischfarbe (Braun) als kleiner Kreis -->
  <circle cx="256" cy="290" r="48" fill="#795548" stroke="#3a2519" stroke-width="6"/>
  <ellipse cx="244" cy="278" rx="10" ry="14" fill="rgba(255,255,255,0.55)"/>
</svg>
